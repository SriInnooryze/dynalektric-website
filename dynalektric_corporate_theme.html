  <style>/* ============================================================
   Dynalektric — Editorial Industrial Design System
   ============================================================ */

:root {
  /* Corporate — cool slate base, deep navy ink */
  --bg: #F5F7FA;
  --bg-alt: #EAEFF5;
  --bg-card: #FFFFFF;
  --ink: #002A52;
  --ink-soft: #334155;
  --ink-muted: #64748B;
  --rule: #E2E8F0;
  --rule-soft: #EEF2F7;

  /* Dual accent — corporate azure + primary navy */
  --accent: #0077B6;
  --accent-hover: #005F92;
  --accent-soft: #D7EEF8;
  --accent-2: #003366;
  --accent-2-soft: #D6E1EE;

  /* Brand brights (decorative, non-text) */
  --brand-bright: #00AEEF;
  --brand-light: #7DD3FC;

  /* Typography */
  --font-display: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Source Sans Pro', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Density */
  --section-y: 120px;
  --container-max: 1360px;
  --gutter: 64px;

  /* Effects */
  --radius: 6px;
  --radius-card: 12px;
  --shadow-card: 0 1px 2px rgba(0,42,82,0.05), 0 10px 30px rgba(0,42,82,0.06);
  --shadow-card-hover: 0 2px 4px rgba(0,42,82,0.06), 0 20px 48px rgba(0,42,82,0.13);
}

@media (max-width: 1200px) {
  :root { --gutter: 48px; }
}

@media (max-width: 768px) {
  :root { --gutter: 24px; --section-y: 80px; }
  h1 { font-size: clamp(36px, 10vw, 48px); }
  h2 { font-size: clamp(28px, 8vw, 36px); }
}

[data-density="compact"] {
  --section-y: 80px;
  --gutter: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* Suppress standalone-bundler error toast — video/font load failures are non-fatal */
#__bundler_err { display: none !important; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background textures */
body[data-texture="grid"]::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(to right, rgba(14,17,22,0.025) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(14,17,22,0.025) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
  z-index: 0;
}
body[data-texture="dots"]::before {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(14,17,22,0.07) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* App root sits above texture */
#app { position: relative; z-index: 1; }

/* Typography */
h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-wrap: balance;
}
h1 { font-size: clamp(42px, 5.5vw, 92px); line-height: 0.96; letter-spacing: -0.035em; font-weight: 450; }
h2 { font-size: clamp(32px, 3.5vw, 56px); line-height: 1.02; letter-spacing: -0.025em; }
h3 { font-size: clamp(20px, 1.8vw, 28px); line-height: 1.15; letter-spacing: -0.015em; }
h4 { font-size: 18px; line-height: 1.3; letter-spacing: -0.01em; }

p { color: var(--ink-soft); text-wrap: pretty; }
.lead { font-size: 20px; line-height: 1.5; color: var(--ink-soft); max-width: 60ch; }

/* Mono utilities */
.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
.mono-num { font-family: var(--font-mono); font-feature-settings: 'tnum'; }

/* Layout */
.container {
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--gutter);
}
.section { padding: var(--section-y) 0; }
.section-tight { padding: calc(var(--section-y) * 0.6) 0; }

.rule { height: 1px; background: var(--rule); border: 0; }
.rule-soft { height: 1px; background: var(--rule-soft); border: 0; }

/* Section header pattern */
.section-head {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: var(--gutter);
  align-items: end;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 64px;
}
.section-head .eyebrow { display: flex; align-items: center; gap: 12px; }
.section-head .eyebrow .num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.section-head .eyebrow .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); }
@media (max-width: 800px) {
  .section-head { grid-template-columns: 1fr; gap: 24px; }
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 200ms cubic-bezier(.2,.8,.2,1);
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: var(--bg);
}
.btn-primary:hover {
  background: var(--accent);
  transform: translateY(-1px);
}
.btn-primary .arrow { transition: transform 200ms; }
.btn-primary:hover .arrow { transform: translateX(4px); }

.btn-secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn-secondary:hover {
  background: var(--ink);
  color: var(--bg);
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  padding: 14px 0;
  border-bottom: 1px solid var(--ink);
  border-radius: 0;
}
.btn-ghost:hover { color: var(--accent); border-color: var(--accent); }

/* Reveal on scroll */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 700ms cubic-bezier(.2,.8,.2,1), transform 700ms cubic-bezier(.2,.8,.2,1); }
.reveal.is-visible { opacity: 1; transform: translateY(0); }

/* Top bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(246,244,239,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule-soft);
}
.topbar-inner {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 24px;
  padding: 18px var(--gutter);
  max-width: var(--container-max);
  margin: 0 auto;
}
.topbar-logo { display: flex; align-items: center; height: 36px; }
.topbar-logo img { height: 32px; width: auto; display: block; }
.topbar-nav {
  display: flex;
  gap: 4px;
  justify-content: center;
  min-width: 0;
  overflow: hidden;
}
.nav-link {
  background: none;
  border: 0;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--ink-muted);
  --_np: 14px;
  padding: 8px var(--_np);
  white-space: nowrap;
  border-radius: var(--radius);
  cursor: pointer;
  transition: color 150ms;
  position: relative;
}
.nav-link:hover { color: var(--ink); }
.nav-link[aria-current="page"] { color: var(--ink); }
.nav-link::after {
  content: '';
  position: absolute;
  left: var(--_np);
  right: var(--_np);
  bottom: 2px;
  height: 1px;
  background: var(--brand-bright);
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 200ms cubic-bezier(.2,.8,.2,1);
}
.nav-link:hover::after,
.nav-link[aria-current="page"]::after {
  transform: scaleX(1);
}
.topbar-cta {
  display: flex;
  gap: 12px;
  align-items: center;
}
.topbar-meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); letter-spacing: 0.1em; }

@media (max-width: 1100px) {
  .topbar-nav { display: none; }
  .topbar-meta { display: none; }
}
@media (max-width: 900px) {
  .topbar-cta .btn { display: none; }
}

/* Mobile menu button */
.menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--rule);
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
}
@media (max-width: 1100px) {
  .menu-btn { display: block; }
}

/* Mobile drawer */
.mobile-drawer {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  padding: 80px var(--gutter) var(--gutter);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transform: translateY(-100%);
  transition: transform 300ms cubic-bezier(.2,.8,.2,1);
}
.mobile-drawer.is-open { transform: translateY(0); }
.mobile-drawer .nav-link { font-size: 28px; padding: 16px 0; text-align: left; font-family: var(--font-display); font-weight: 500; letter-spacing: -0.02em; }
.mobile-drawer .close-btn {
  position: absolute;
  top: 18px; right: var(--gutter);
}

/* Footer */
.footer {
  background: var(--ink);
  color: var(--bg);
  padding: 80px 0 32px;
  margin-top: var(--section-y);
}
.footer h4 { color: var(--bg); font-size: 13px; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; opacity: 0.6; margin-bottom: 20px; }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; padding-bottom: 64px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.footer-col a { color: rgba(246,244,239,0.7); text-decoration: none; font-size: 14px; transition: color 150ms; cursor: pointer; }
.footer-col a:hover { color: var(--accent); }
.footer-bottom { padding-top: 24px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: rgba(246,244,239,0.5); }
.footer-bottom span { text-transform: uppercase; }
.footer-brand { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.02em; margin-bottom: 16px; }
.footer-tag { color: rgba(246,244,239,0.7); font-size: 14px; max-width: 36ch; line-height: 1.6; }
@media (max-width: 800px) {
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
  .footer-bottom { flex-direction: column; gap: 12px; align-items: flex-start; }
}

/* Card primitive */
.card {
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-card);
  transition: transform 300ms cubic-bezier(.2,.8,.2,1), box-shadow 300ms, border-color 300ms;
}
.card:hover {
  border-color: var(--rule);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}

/* Image slot defaults */
image-slot {
  --slot-bg: var(--bg-alt);
  --slot-border: var(--rule);
  --slot-fg: var(--ink-muted);
  background: var(--bg-alt);
}

/* Striped placeholder for non-image slots */
.placeholder-stripe {
  background: repeating-linear-gradient(
    -45deg,
    var(--bg-alt),
    var(--bg-alt) 8px,
    transparent 8px,
    transparent 16px
  ), var(--bg-card);
  border: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* Page transition */
.page-enter { animation: pageIn 400ms cubic-bezier(.2,.8,.2,1); }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Tweaks panel positioning override */
.tweaks-panel { z-index: 200 !important; }

/* Form elements */
.form-row { display: flex; flex-direction: column; gap: 8px; }
.form-row label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.form-row input,
.form-row select,
.form-row textarea {
  font-family: var(--font-body);
  font-size: 16px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--rule);
  padding: 12px 0;
  color: var(--ink);
  outline: none;
  transition: border-color 200ms;
  width: 100%;
  resize: vertical;
}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {
  border-bottom-color: var(--accent);
}
.form-row input::placeholder,
.form-row textarea::placeholder { color: var(--ink-muted); }

/* Big number display */
.big-num {
  font-family: var(--font-display);
  font-size: clamp(56px, 7vw, 96px);
  font-weight: 350;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--ink);
}

/* Accent dot */
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* Engineering visual — abstract */
.eng-visual {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1.1;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  overflow: hidden;
}
</style>
  <style>/* page-styles.css — page-specific styling */

/* HERO */
.hero-meta {
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
  align-items: center;
}
.hero-meta .mono { color: var(--ink-muted); }

.hero-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 64px;
  align-items: end;
}
.hero-copy h1 { max-width: 14ch; }

.hero-visual {
  position: relative;
}
.hero-visual-frame {
  position: relative;
  border: 1px solid var(--rule);
  background: var(--bg-card);
  aspect-ratio: 1 / 1.1;
  overflow: hidden;
}
.hero-visual-badge {
  position: absolute;
  top: 16px; left: 16px;
  background: var(--bg);
  border: 1px solid var(--rule);
  padding: 6px 10px;
  display: flex;
  gap: 16px;
  align-items: center;
}
.hero-visual-corner {
  position: absolute;
  width: 12px; height: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-visual-corner.top-left { top: 6px; left: 6px; }
.hero-visual-corner.top-right { top: 6px; right: 6px; }
.hero-visual-corner.bottom-left { bottom: 6px; left: 6px; }
.hero-visual-corner.bottom-right { bottom: 6px; right: 6px; }

@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  .hero-copy h1 { max-width: 100%; }
  .hero-meta { gap: 16px; }
  .hero-meta .mono { font-size: 10px; }
}

/* Hero ticker */
.hero-ticker {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 24px;
}
.hero-ticker-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 0;
  border-top: 2px solid var(--ink);
  font-size: 13px;
  color: var(--ink);
  font-weight: 500;
}
.hero-ticker-item .num { color: var(--ink-muted); }
@media (max-width: 900px) {
  .hero-ticker { grid-template-columns: repeat(2, 1fr); }
}

/* Product grid (Home) */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.product-grid-4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 1200px) {
  .product-grid-4 { grid-template-columns: repeat(4, 1fr); }
}
.product-card {
  text-align: left;
  background: var(--bg-card);
  border: 0;
  cursor: pointer;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  transition: background 250ms;
  font: inherit;
  color: inherit;
}
.product-card:hover { background: var(--bg-alt); }
.product-card-num { color: var(--ink-muted); }
.product-card-img { aspect-ratio: 4/3; }
.product-card-img image-slot { width: 100%; height: 100%; }
.product-card-body { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.product-card-body > p { flex: 1; min-height: 0; }
.product-card-foot {
  margin-top: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 24px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
}
.product-card-subs {
  color: var(--accent);
  font-weight: 600;
  margin-top: 4px;
}
.product-card:hover .arrow { color: var(--accent); transform: translateX(4px); transition: transform 200ms; }
@media (max-width: 900px) {
  .product-grid { grid-template-columns: 1fr; }
  .product-card { padding: 28px 24px; }
}

/* Industry strip */
.industry-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.08);
  border-top: 1px solid rgba(255,255,255,0.08);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.industry-strip-6 { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 1200px) {
  .industry-strip-6 { grid-template-columns: repeat(6, 1fr); }
}
.industry-strip-item {
  background: var(--ink);
  border: 0;
  text-align: left;
  cursor: pointer;
  padding: 40px 24px;
  color: var(--bg);
  display: flex;
  flex-direction: column;
  transition: background 250ms;
  font: inherit;
}
.industry-strip-item:hover { background: #1a1d22; }
.industry-strip-item .num { margin-bottom: 32px; }
@media (max-width: 1100px) { .industry-strip { grid-template-columns: repeat(2, 1fr); } }

/* Why grid */
.why-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.why-item { 
  background: var(--bg-card); 
  padding: 40px 32px;
  min-height: 240px;
  display: flex;
  flex-direction: column;
}
.why-item .num { color: var(--accent); display: block; margin-bottom: 24px; font-weight: 600; }
.why-item h3 { margin-bottom: 12px; font-size: 18px; }
.why-item p { font-size: 14px; line-height: 1.6; }
@media (max-width: 900px) { .why-grid { grid-template-columns: 1fr; } }
@media (min-width: 901px) and (max-width: 1100px) { .why-grid { grid-template-columns: 1fr 1fr; } }

/* R&D teaser */
.rnd-teaser {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 80px;
  align-items: center;
}
.rnd-teaser-copy h2 { max-width: 14ch; }
@media (max-width: 900px) { .rnd-teaser { grid-template-columns: 1fr; gap: 40px; } }

/* Hero quickfacts */
.hero-quickfacts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid var(--rule);
}
.hero-quickfacts .mono {
  color: var(--ink-muted);

}
.hero-quickfacts .val {

}

/* Supplier qualification CTA */
.qual-cta {
  margin-top: 48px;
  background: var(--bg-card);

  gap: 48px;
}
.qual-cta h3 { font-size: 22px; max-width: 26ch; }

  .qual-cta { flex-direction: column; align-items: flex-start; padding: 32px 28px; }
}

/* Standards grid */
.standards-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 48px;

}
.qa-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 32px;
}

  .standards-grid { grid-template-columns: 1fr; gap: 32px; }
}

/* Stats */
.stats-row {

}
@media (max-width: 900px) { .stats-row { grid-template-columns: 1fr 1fr; gap: 32px; } }

.cert-row {

  border: 1px solid var(--rule-soft);
}
.cert-item {

}
.cert-item:hover { background: var(--bg-alt); }

.cert-label { font-size: 10px; }
@media (max-width: 900px) { .cert-row { grid-template-columns: repeat(2, 1fr); } }

/* Highlight grid */
.highlight-grid {

  grid-template-columns: 1fr 1fr;
  gap: 32px;
}
.highlight-card { overflow: hidden; }
.highlight-card:hover .placeholder-stripe { opacity: 0.8; }
@media (max-width: 900px) { .highlight-grid { grid-template-columns: 1fr; } }

/* Brochure strip */
.brochure-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 48px;
  padding: 48px;

  box-shadow: var(--shadow-card);
}
.brochure-strip h3 { font-size: 20px; }
@media (max-width: 900px) { .brochure-strip { flex-direction: column; align-items: flex-start; } }

/* === ABOUT === */
.about-hero {
  padding: 64px 0 48px;
}
.about-hero h1 { max-width: 18ch; }
.about-grid {
  display: grid; grid-template-columns: 1fr 1.4fr; gap: 64px; align-items: start;
}
.about-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 56px;
}
@media (max-width: 900px) {
  .about-stats { grid-template-columns: 1fr; gap: 32px; }
  .stats-row { grid-template-columns: 1fr; gap: 32px; }
}
.about-cap-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.about-cap-item {
  background: var(--bg-card);
  padding: 40px 32px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
}
.about-cap-item .num { color: var(--accent); margin-bottom: 24px; display: block; font-weight: 600; }
.about-cap-item h3 { margin-bottom: 12px; flex-shrink: 0; }
.about-cap-item p { font-size: 14px; line-height: 1.6; }
@media (max-width: 900px) { .about-cap-grid { grid-template-columns: 1fr; } }

/* === PRODUCTS === */
.products-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 64px;
  align-items: start;
}
.products-anchor {
  position: sticky;
  top: 96px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-left: 1px solid var(--rule);
  padding-left: 0;
}
.products-anchor a {
  padding: 14px 16px;
  text-decoration: none;
  color: var(--ink-muted);
  font-size: 13px;
  font-family: var(--font-body);
  display: flex;
  gap: 12px;
  cursor: pointer;
  border-left: 2px solid transparent;
  margin-left: -1px;
  transition: all 200ms;
}
.products-anchor a:hover { color: var(--ink); }
.products-anchor a.is-active {
  color: var(--ink);
  border-left-color: var(--accent);
  background: var(--bg-alt);
}
.products-anchor a .num { color: var(--ink-muted); font-family: var(--font-mono); font-size: 11px; }
.products-anchor a.is-active .num { color: var(--accent); }

.product-section {
  padding-bottom: 96px;
  margin-bottom: 96px;
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 100px;
}
.product-section:last-child { border-bottom: 0; margin-bottom: 0; }
.product-section-head {
  display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: end;
  margin-bottom: 48px;
}
.product-section-num {
  font-family: var(--font-display);
  font-size: 80px;
  font-weight: 350;
  letter-spacing: -0.04em;
  color: var(--accent);
  line-height: 0.9;
}
.product-detail-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 48px;
}
.product-detail-img { aspect-ratio: 4/3; }
.product-detail-img image-slot { width: 100%; height: 100%; }
.product-detail-list {
  display: flex; flex-direction: column; gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.product-detail-list-item {
  background: var(--bg-card);
  padding: 16px 20px;
  display: flex; gap: 16px;
  font-size: 14px;
}
.product-detail-list-item .check { color: var(--accent); font-family: var(--font-mono); }

.product-spec-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule-soft);
  margin-top: 32px;
  border: 1px solid var(--rule-soft);
}
.product-spec-cell {
  background: var(--bg-card);
  padding: 24px 20px;
}
.product-spec-cell .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; font-weight: 600; }
.product-spec-cell .v { font-size: 16px; color: var(--ink); font-weight: 500; }

.product-acc {
  margin-top: 32px;
  border-top: 1px solid var(--rule);
}
.product-acc-row {
  border-bottom: 1px solid var(--rule);
}
.product-acc-row > button {
  width: 100%;
  background: none;
  border: 0;
  padding: 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  font: inherit;
  color: var(--ink);
  text-align: left;
}
.product-acc-row > button .label { font-size: 16px; font-weight: 500; }
.product-acc-row .body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 350ms cubic-bezier(.2,.8,.2,1);
}
.product-acc-row.open .body { max-height: 600px; }
.product-acc-row .body-inner { padding: 0 0 24px; font-size: 14px; color: var(--ink-soft); }
.product-acc-row .icon { transition: transform 250ms; font-family: var(--font-mono); color: var(--ink-muted); }
.product-acc-row.open .icon { transform: rotate(45deg); color: var(--accent); }

@media (max-width: 1000px) {
  .products-layout { grid-template-columns: 1fr; }
  .products-anchor { position: static; flex-direction: row; flex-wrap: wrap; border-left: 0; border-top: 1px solid var(--rule); padding-top: 16px; gap: 8px; }
  .products-anchor a { padding: 10px 14px; font-size: 12px; }
  .product-detail-grid { grid-template-columns: 1fr; }
  .product-section-head { grid-template-columns: 1fr; }
  .product-section-num { font-size: 56px; }
  .product-spec-row { grid-template-columns: 1fr; }
}

/* === INDUSTRIES MATRIX === */
.matrix-intro {
  background: var(--bg-alt);
  border: 1px solid var(--rule);
  padding: 24px 32px;
  margin-bottom: 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 32px;
}
.matrix-intro-copy h4 { font-size: 16px; margin-bottom: 8px; }
.matrix-intro-copy p { font-size: 14px; color: var(--ink-soft); }
.matrix-legend {
  display: flex;
  gap: 24px;
  align-items: center;
}
.matrix-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-soft);
}
.matrix-legend-item .mark {
  width: 14px; height: 14px;
  border: 1px solid var(--rule);
  border-radius: 50%;
  background: transparent;
}
.matrix-legend-item .mark.filled {
  background: var(--accent);
  border-color: var(--accent);
}

.matrix-wrap {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
}
.matrix-table {
  border: 1px solid var(--rule);
  background: var(--bg-card);
  display: grid;
  grid-template-columns: 1.6fr repeat(5, 1fr);
  box-shadow: var(--shadow-card);
}
.matrix-table.matrix-4col { grid-template-columns: 1.6fr repeat(4, 1fr); }
.matrix-cell {
  padding: 18px 12px;
  border-right: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  font-size: 12px;
  text-align: center;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 200ms, border-color 200ms;
  position: relative;
}
.matrix-cell:nth-child(6n) { border-right: 0; }
.matrix-table.matrix-4col .matrix-cell:nth-child(6n) { border-right: 1px solid var(--rule-soft); }
.matrix-table.matrix-4col .matrix-cell:nth-child(5n) { border-right: 0; }
.matrix-cell.head {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: var(--bg-alt);
  padding: 20px 10px;
  text-align: center;
  cursor: default;
  font-weight: 600;
}
.matrix-cell.row-head {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  justify-content: flex-start;
  background: var(--bg-alt);
  cursor: pointer;
  padding: 18px 20px;
}
.matrix-cell.row-head:hover { background: #e8e5db; }
.matrix-cell.row-head .num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-right: 10px; font-weight: 600; }
.matrix-cell .mark {
  width: 18px; height: 18px;
  border: 2px solid var(--rule);
  border-radius: 50%;
  background: transparent;
  transition: all 250ms cubic-bezier(.2,.8,.2,1);
}
.matrix-cell.is-on .mark {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(1.1);
}
.matrix-cell.is-active-row { background: rgba(184,96,44,0.04); }
.matrix-cell.is-active-col { background: rgba(31,58,95,0.04); }
.matrix-cell.is-active-row.is-active-col { background: rgba(184,96,44,0.08); }
.matrix-cell.is-active-row.is-on .mark, .matrix-cell.is-active-col.is-on .mark { 
  background: var(--accent); 
  box-shadow: 0 0 0 4px rgba(184,96,44,0.2);
  border-width: 2px;
  transform: scale(1.15);
}
.matrix-cell:not(.head):not(.row-head):hover {
  background: rgba(184,96,44,0.06);
}

.industry-detail {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 40px 36px;
  position: sticky; top: 96px;
  box-shadow: var(--shadow-card);
}
.industry-detail .num { font-family: var(--font-mono); color: var(--accent); margin-bottom: 16px; font-size: 11px; letter-spacing: 0.1em; font-weight: 600; }
.industry-detail h3 { margin-bottom: 16px; font-size: 22px; }
.industry-detail p { margin-top: 12px; font-size: 14px; line-height: 1.6; }
.industry-detail .apps { display: flex; flex-direction: column; gap: 1px; background: var(--rule-soft); margin-top: 28px; border: 1px solid var(--rule-soft); }
.industry-detail .apps-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px; margin-top: 24px; }
.industry-detail .apps li { background: var(--bg); padding: 14px 16px; font-size: 13px; list-style: none; }

@media (max-width: 1100px) {
  .matrix-wrap { grid-template-columns: 1fr; }
  .matrix-table { font-size: 10px; grid-template-columns: 1.8fr repeat(5, 1fr); }
  .matrix-table.matrix-4col { grid-template-columns: 1.8fr repeat(4, 1fr); }
  .matrix-cell { padding: 12px 6px; }
  .matrix-cell .mark { width: 12px; height: 12px; border-width: 1px; }
  .matrix-cell.head { font-size: 9px; padding: 16px 6px; }
  .matrix-cell.row-head { font-size: 12px; padding: 14px 12px; }
  .industry-detail { position: static; margin-top: 32px; }
  .matrix-intro { flex-direction: column; align-items: flex-start; padding: 20px 24px; }
  .matrix-legend { flex-direction: column; align-items: flex-start; gap: 12px; }
}

/* Industries detailed cards */
.industry-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.industry-card {
  display: grid;
  grid-template-columns: 100px 1.3fr 1.1fr 1fr;
  gap: 40px;
  padding: 48px 40px;
  background: var(--bg-card);
  align-items: start;
}
.industry-card .num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.1em; font-weight: 600; }
.industry-card h3 { margin-bottom: 12px; font-size: 20px; }
.industry-card .body { font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
.industry-card .apps { display: flex; flex-direction: column; gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); }
.industry-card .apps-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px; font-weight: 600; }
.industry-card .apps li { list-style: none; font-size: 13px; padding: 12px 16px; background: var(--bg); color: var(--ink-soft); }
.industry-card .cta-col { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
@media (max-width: 1000px) {
  .industry-card { grid-template-columns: 1fr; gap: 24px; padding: 40px 32px; }
}

/* Calculator */
.calculator {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  box-shadow: var(--shadow-card);
}
.calculator-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 0;
}
.calculator-form {
  padding: 48px 40px;
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.calculator-header h3 { font-size: 24px; }
.calculator-output {
  padding: 48px 40px;
  background: var(--bg-alt);
}
.calc-output-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 32px;
}
.calc-field {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.calc-field label.mono {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  font-weight: 600;
}
.calc-field select {
  font-family: var(--font-body);
  font-size: 15px;
  background: var(--bg);
  border: 1px solid var(--rule);
  padding: 12px 14px;
  color: var(--ink);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 200ms;
}
.calc-field select:focus {
  outline: none;
  border-color: var(--accent);
}
.calc-radio-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.calc-radio {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 200ms;
  font-size: 14px;
}
.calc-radio:hover {
  border-color: var(--ink);
  background: var(--bg-alt);
}
.calc-radio input[type="radio"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
}
.calc-radio input[type="radio"]:checked + span {
  font-weight: 500;
  color: var(--ink);
}

@media (max-width: 1000px) {
  .calculator-grid { grid-template-columns: 1fr; }
  .calculator-form { border-right: 0; border-bottom: 1px solid var(--rule); padding: 32px 24px; }
  .calculator-output { padding: 32px 24px; }
}
.rnd-hero {
  padding: 80px 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: end;
}
.rnd-hero h1 { max-width: 14ch; }
@media (max-width: 900px) { .rnd-hero { grid-template-columns: 1fr; } }

.cap-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.cap-card {
  background: var(--bg-card);
  padding: 40px 32px;
  position: relative;

  cursor: pointer;
  min-height: 280px;
  display: flex;

}
.cap-card:hover { background: var(--ink); color: var(--bg); }
.cap-card .num { color: var(--accent); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; }
.cap-card h3 { margin-top: 16px; transition: color 250ms; }
.cap-card:hover h3, .cap-card:hover .reveal-body { color: var(--bg); }
.cap-card .reveal-body {

.cap-card .footer-mark {

@media (max-width: 900px) { .cap-grid { grid-template-columns: 1fr; } }

/* Process flow */

.process-step .num {
  font-family: var(--font-display);

.process-step h4 { font-size: 16px; }
.process-step p { font-size: 13px; }
@media (max-width: 900px) { .process-flow { grid-template-columns: 1fr 1fr; } }

  grid-template-columns: 1.2fr 1fr;

   v2 additions — subcategory cards, focus areas, export, doc rows
   ============================================================ */

  margin-top: 48px;

}
.subcat-head {

  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 24px;
}
.subcat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
@media (min-width: 1100px) {
  .subcat-grid { grid-template-columns: repeat(3, 1fr); }
}
.subcat-card {
  background: var(--bg-card);
  padding: 24px 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 160px;

}
.subcat-card:hover { background: var(--bg-alt); }
.subcat-card-code {
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 4px;
}
.subcat-card-name {
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.subcat-card-detail {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.5;
  flex: 1;
}
.subcat-card-foot {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--rule-soft);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.subcat-card-foot .mono { color: var(--ink-muted); font-size: 10px; }
.subcat-card-cta {
  background: none;
  border: 0;
  color: var(--ink);
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  padding: 4px 0;
  transition: color 150ms;
}
.subcat-card-cta:hover { color: var(--accent); }

/* Documentation accordion content */
.doc-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.doc-item {
  padding: 16px 20px;
  background: var(--bg-alt);
  border: 1px solid var(--rule-soft);
}
.doc-item .mono {
  color: var(--accent);
  margin-bottom: 6px;
  font-weight: 600;
}
.doc-detail {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.5;
}
@media (max-width: 800px) {
  .doc-row { grid-template-columns: 1fr; }
}

/* === Innovation & R&D Portfolio === */
.focus-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
@media (min-width: 1100px) {
  .focus-grid { grid-template-columns: repeat(4, 1fr); }
}
.focus-deliverables {
  margin-top: 16px;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.focus-deliverables li {
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  gap: 8px;
  align-items: baseline;
}
.focus-deliverables li .mono {
  color: var(--accent);
  font-weight: 600;
}
.cap-card:hover .focus-deliverables li,
.cap-card:hover .focus-deliverables li .mono {
  color: rgba(246,244,239,0.85);
}

/* === Export page === */
.region-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
@media (min-width: 1100px) {
  .region-grid { grid-template-columns: repeat(5, 1fr); }
}
.region-card {
  background: var(--bg-card);
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 220px;
}
.region-code {
  font-family: var(--font-display);
  font-size: 36px;
  font-weight: 400;
  letter-spacing: -0.03em;
  color: var(--accent);
  line-height: 1;
}
.region-card h3 { font-size: 18px; }
.region-card p { font-size: 13px; line-height: 1.6; }

.export-doc-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
@media (min-width: 1100px) {
  .export-doc-grid { grid-template-columns: repeat(4, 1fr); }
}
.export-doc-card {
  background: var(--bg-card);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 280px;
}
.export-doc-card .num {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 600;
}
.export-doc-card h3 { font-size: 18px; margin-bottom: 8px; }
.export-doc-card ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.export-doc-card li {
  font-size: 13px;
  color: var(--ink-soft);
  display: flex;
  gap: 10px;
}
.export-doc-card li .mono {
  color: var(--accent);
  font-weight: 600;
}

/* Process flow with 6 steps */
.process-flow-6 {
  grid-template-columns: repeat(3, 1fr);
}
@media (min-width: 1100px) {
  .process-flow-6 { grid-template-columns: repeat(6, 1fr); }
}
@media (max-width: 700px) {
  .process-flow-6 { grid-template-columns: repeat(2, 1fr); }
}

/* Anonymous buyer grid */
.anon-buyer-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
  margin-bottom: 48px;
}
@media (min-width: 1100px) {
  .anon-buyer-grid { grid-template-columns: repeat(3, 1fr); }
}
.anon-buyer-card {
  background: var(--bg-card);
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 180px;
}
.anon-buyer-card .num {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 400;
  letter-spacing: -0.02em;
  color: var(--accent);
  line-height: 1;
}
.anon-buyer-name {
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  margin-top: 8px;
}
.anon-buyer-detail {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.6;
}

/* Client logo strip */
.logo-strip {
  margin-top: 48px;
  padding: 32px;
  background: var(--bg-alt);
  border: 1px solid var(--rule);
}
.logo-strip-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 24px;
}
.logo-strip-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
@media (min-width: 1100px) {
  .logo-strip-grid { grid-template-columns: repeat(6, 1fr); }
}
.logo-slot {
  aspect-ratio: 3 / 2;
  background: var(--bg-card);
  border: 1px dashed var(--rule);
}
.logo-slot image-slot {
  width: 100%;
  height: 100%;
  display: block;
}




/* ============================================================
   Export page v2 — 8 sections
   ============================================================ */

/* Hero */
.export-hero { padding-bottom: calc(var(--section-y) * 0.6); }
.export-hero-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 64px;
  align-items: end;
}
.export-hero-meta {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 24px 28px;
  display: flex;
  flex-direction: column;
}
.export-hero-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 12px 0;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 13px;
  gap: 16px;
}
.export-hero-meta-row:last-child { border-bottom: 0; }
.export-hero-meta-row .mono { color: var(--ink-muted); flex-shrink: 0; }
.export-hero-meta-row span:last-child { color: var(--ink); font-weight: 500; text-align: right; }
@media (max-width: 900px) {
  .export-hero-grid { grid-template-columns: 1fr; gap: 32px; }
}

/* Overview */
.export-overview {
  display: grid;
  grid-template-columns: 1fr 1.6fr;
  gap: 64px;
  align-items: start;
  padding: 16px 0;
}
.export-overview h2 { max-width: 14ch; }
@media (max-width: 900px) {
  .export-overview { grid-template-columns: 1fr; gap: 24px; }
}

/* Documentation grid scaled to 8 items */
.export-doc-grid-8 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 700px)  { .export-doc-grid-8 { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1000px) { .export-doc-grid-8 { grid-template-columns: repeat(4, 1fr); } }

/* why-grid override for 3 columns when given .why-grid-3 */
.why-grid.why-grid-3 {
  grid-template-columns: repeat(1, 1fr);
}
@media (min-width: 800px) {
  .why-grid.why-grid-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 1100px) {
  .why-grid.why-grid-3 { grid-template-columns: repeat(3, 1fr); }
}

/* Logistics grid (dark section) */
.export-logistics-grid {
  display: grid;
  grid-template-columns: repeat(1, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.08);
}
@media (min-width: 800px)  { .export-logistics-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .export-logistics-grid { grid-template-columns: repeat(3, 1fr); } }
.export-logistics-card {
  background: var(--ink);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 200px;
}
.export-logistics-card .num {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  font-weight: 600;
}
.export-logistics-card h3 {
  color: var(--bg);
  font-size: 18px;
  margin-bottom: 4px;
}
.export-logistics-card p {
  color: rgba(246,244,239,0.75);
  font-size: 13px;
  line-height: 1.6;
}

/* Product category export accordions */
.cat-export-list {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule);
}
.cat-export-card {
  background: var(--bg-card);
}
.cat-export-head {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 32px;
  background: none;
  border: 0;
  cursor: pointer;
  text-align: left;
  transition: background 200ms;
}
.cat-export-head:hover { background: var(--bg-alt); }
.cat-export-head .num {
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 6px;
}
.cat-export-head h3 {
  font-size: 22px;
  letter-spacing: -0.015em;
}
.cat-export-icon {
  font-size: 28px;
  color: var(--accent);
  font-weight: 300;
  line-height: 1;
}
.cat-export-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 400ms ease;
}
.cat-export-card.open .cat-export-body {
  max-height: 1000px;
  transition: max-height 600ms ease;
}
.cat-export-body-inner {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 32px;
  padding: 0 32px 32px;
  border-top: 1px solid var(--rule-soft);
  padding-top: 24px;
}
@media (max-width: 1100px) {
  .cat-export-body-inner { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 700px) {
  .cat-export-body-inner { grid-template-columns: 1fr; padding: 0 24px 24px; padding-top: 20px; }
}
.cat-export-col .colhead {
  color: var(--ink-muted);
  font-weight: 600;
  margin-bottom: 12px;
}
.cat-export-col ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.cat-export-col li {
  font-size: 13px;
  color: var(--ink-soft);
  display: flex;
  gap: 8px;
  line-height: 1.5;
}
.cat-export-col li .mono { color: var(--accent); font-weight: 600; }
.cat-export-cta {
  display: flex;
  flex-direction: column;
  gap: 12px;
  justify-content: flex-start;
}
.cat-export-cta .btn { justify-content: center; }

/* Final CTA panel */
.export-final {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 56px 56px;
  display: grid;
  grid-template-columns: 1.6fr 1fr;
  gap: 64px;
  align-items: start;
}
.export-final-copy h2 { max-width: 20ch; }
.export-final-checklist ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-top: 16px;
  border-top: 1px solid var(--rule);
}
.export-final-checklist li {
  display: flex;
  gap: 16px;
  align-items: baseline;
  font-size: 14px;
  color: var(--ink-soft);
  padding-bottom: 10px;
  border-bottom: 1px solid var(--rule-soft);
}
.export-final-checklist li:last-child { border-bottom: 0; }
.export-final-checklist li .mono {
  color: var(--accent);
  font-weight: 600;
  font-size: 11px;
  flex-shrink: 0;
  min-width: 24px;
}
@media (max-width: 900px) {
  .export-final { grid-template-columns: 1fr; padding: 32px 28px; gap: 32px; }
}


/* ============================================================
   RFQ form additions
   ============================================================ */
.form-section-head {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule);
}
.form-section-head h3 {
  font-size: 22px;
  letter-spacing: -0.015em;
  margin-top: 8px;
}
.form-err {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* File upload */
.rfq-upload {
  display: flex;
  align-items: stretch;
  min-height: 56px;
  margin-top: 4px;
}
.rfq-upload-btn {
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  background: var(--bg-alt);
  border: 1px dashed var(--rule);
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--ink);
  transition: border-color 200ms, background 200ms;
}
.rfq-upload-btn:hover {
  border-color: var(--accent);
  background: var(--bg-card);
}
.rfq-upload-btn .mono {
  color: var(--accent);
  font-size: 18px;
  font-weight: 600;
}
.rfq-upload-file {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  gap: 16px;
}
.rfq-upload-remove {
  background: none;
  border: 0;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-soft);
  cursor: pointer;
  padding: 6px 10px;
  border: 1px solid var(--rule);
  transition: color 150ms, border-color 150ms;
}
.rfq-upload-remove:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.rfq-upload-note {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 8px;
  line-height: 1.5;
  font-style: italic;
}

.form-footer {
  border-top: 1px solid var(--rule);
  padding-top: 24px;
  margin-top: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

/* Success summary */
.success-summary {
  margin: 32px auto 0;
  max-width: 520px;
  text-align: left;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 24px 28px;
}
.success-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 0;
  border-bottom: 1px solid var(--rule-soft);
  font-size: 13px;
}
.success-row:last-child { border-bottom: 0; }
.success-row .mono { color: var(--ink-muted); }
.success-row span:last-child { color: var(--ink); font-weight: 500; text-align: right; }

/* ============================================================
   Anonymous case study cards (shared)
   ============================================================ */
.case-grid {
  display: grid;
  grid-template-columns: repeat(1, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
@media (min-width: 800px)  { .case-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .case-grid { grid-template-columns: repeat(3, 1fr); } }
.case-card {
  background: var(--bg-card);
  padding: 32px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-height: 320px;
}
.case-card .case-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}
.case-card h3 {
  font-size: 20px;
  letter-spacing: -0.015em;
  line-height: 1.25;
}
.case-card .case-section {
  border-top: 1px solid var(--rule-soft);
  padding-top: 10px;
}
.case-card .case-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  margin-bottom: 4px;
}
.case-card .case-value {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.6;
}

/* Quality consideration row in industry cards */
.industry-card .qa-note {
  background: var(--bg-alt);
  border: 1px solid var(--rule-soft);
  padding: 14px 16px;
  margin-top: 16px;
}
.industry-card .qa-note .case-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
  margin-bottom: 6px;
}
.industry-card .qa-note .case-value {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.55;
}


/* ============================================================
   Global overflow guard
   ============================================================ */
html, body { overflow-x: clip; }
.container { max-width: var(--container-max); margin: 0 auto; padding: 0 32px; box-sizing: border-box; }
@media (max-width: 600px) {
  .container { padding: 0 20px; }
}
/* Block any rogue image from causing overflow */
img, video, svg, image-slot { max-width: 100%; }
/* All section children get safe min-width on grid items */
.section, .page-hero, main { min-width: 0; }

/* ============================================================
   Products explorer (v3) — left rail + main column
   ============================================================ */

/* Mobile tabs strip (hidden on desktop) */
.prodx-tabs {
  display: none;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.prodx-tab {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 10px 14px;
  font-size: 12px;
  letter-spacing: 0.02em;
  cursor: pointer;
  font-family: var(--font-body);
  color: var(--ink-soft);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border-radius: 2px;
  transition: all 200ms;
  min-width: 0;
}
.prodx-tab:hover { color: var(--ink); border-color: var(--ink-muted); }
.prodx-tab.is-active {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.prodx-tab .num { color: var(--accent); font-size: 10px; }

/* Main layout */
.prodx-layout {
  display: grid;
  grid-template-columns: minmax(240px, 280px) minmax(0, 1fr);
  gap: 48px;
  align-items: start;
}

/* === LEFT RAIL === */
.prodx-rail {
  position: sticky;
  top: 96px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-self: start;
}
.prodx-rail-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 4px 8px 12px;
  border-bottom: 1px solid var(--rule-soft);
  margin-bottom: 8px;
}
.prodx-rail-item {
  background: none;
  border: 0;
  padding: 14px 12px;
  text-align: left;
  cursor: pointer;
  font-family: var(--font-body);
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  border-left: 2px solid transparent;
  border-radius: 2px;
  transition: all 180ms;
  color: var(--ink-soft);
  min-width: 0;
}
.prodx-rail-item .num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-muted);
  letter-spacing: 0.1em;
}
.prodx-rail-item .name {
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  line-height: 1.3;
  overflow-wrap: break-word;
  min-width: 0;
}
.prodx-rail-item .count {
  font-size: 10px;
  color: var(--ink-muted);
  background: var(--bg-alt);
  padding: 2px 8px;
  border-radius: 999px;
}
.prodx-rail-item:hover { background: var(--bg-alt); color: var(--ink); }
.prodx-rail-item:hover .num { color: var(--accent); }
.prodx-rail-item.is-active {
  background: var(--ink);
  color: var(--bg);
  border-left-color: var(--accent);
}
.prodx-rail-item.is-active .num { color: var(--accent); }
.prodx-rail-item.is-active .count {
  background: rgba(255,255,255,0.1);

  <!-- image-slot web component (plain JS) -->
  <script>
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever you want the user to
 * supply an image. You control the slot's shape and size; the user fills it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The host bridge only allows sidecar writes at the project root, so the
 * HTML that uses this component is assumed to live at the project root too
 * (same constraint as design_canvas.jsx).
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          object-fit: cover | contain | fill.       (default 'cover')
 *                With cover (the default) double-clicking the filled slot
 *                enters a reframe mode: the whole image spills past the mask
 *                (translucent outside, opaque inside), drag to reposition,
 *                corner-drag to scale. The crop persists alongside the image
 *                in the sidecar. contain/fill stay static.
 *   position     object-position for fit=contain|fill.     (default '50% 50%')
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. A user drop overrides
 *                it; clearing the drop reveals src again.
 *
 * Size and layout come from ordinary CSS on the element — width/height
 * inline or from a parent grid — so it composes with any layout.
 *
 * Usage:
 *   <script src="image-slot.js"><\/script>
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */

(() => {
  const STATE_FILE = '.image-slots.state.json';
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }
          for (const id of tombstones) delete merged[id];
          slots = merged;
        }
        tombstones.clear();
      })
      .catch(() => {})
      .then(() => { loaded = true; subs.forEach((fn) => fn()); });
    return loadP;
  }

  // Serialize writes so two near-simultaneous drops on different slots
  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;
  function save() {
    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    saving = true;
    Promise.resolve(w(STATE_FILE, JSON.stringify(slots)))
      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });
  }

  const S_MAX = 5;
  const clampS = (s) => Math.max(1, Math.min(S_MAX, s));

  // Normalize a stored slot value. Pre-reframe sidecars stored a bare
  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.
  function getSlot(id) {
    const v = slots[id];
    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;
  }

  function setSlot(id, val) {
    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }
    else { delete slots[id]; if (!loaded) tombstones.add(id); }
    subs.forEach((fn) => fn());
    // A drop is rare + high-value — write immediately so nav-away can't lose
    // it. Gate on the initial read so we don't overwrite a sidecar we haven't
    // merged yet; the merge in load() keeps this change once the read lands.
    if (loaded) save(); else load().then(save);
  }

  // ── Image downscale ─────────────────────────────────────────────────────
  // Encode through a canvas so the sidecar carries resized bytes, not the
  // raw upload. Longest side is capped at 2× the slot's rendered width
  // (retina) and at MAX_DIM. WebP keeps alpha and is ~10× smaller than PNG
  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.85);
    } finally {
      bitmap.close && bitmap.close();
    }
  }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    ':host{display:inline-block;position:relative;vertical-align:top;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;color:rgba(0,0,0,.55);width:240px;height:160px}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(0,0,0,.04)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.
    '.frame img{position:absolute;max-width:none;transform:translate(-50%,-50%);' +
    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.
    '.spill{position:absolute;transform:translate(-50%,-50%);display:none;z-index:1;' +
    '  cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
    '.spill .handle{position:absolute;width:12px;height:12px;border-radius:50%;' +
    '  background:#fff;box-shadow:0 0 0 1.5px #c96442,0 1px 3px rgba(0,0,0,.3);' +
    '  transform:translate(-50%,-50%)}' +
    '.spill .handle[data-c=nw]{left:0;top:0;cursor:nwse-resize}' +
    '.spill .handle[data-c=ne]{left:100%;top:0;cursor:nesw-resize}' +
    '.spill .handle[data-c=sw]{left:0;top:100%;cursor:nesw-resize}' +
    '.spill .handle[data-c=se]{left:100%;top:100%;cursor:nwse-resize}' +
    ':host([data-reframe]){z-index:10}' +
    ':host([data-reframe]) .spill{display:block}' +
    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  cursor:pointer;user-select:none}' +
    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px;text-decoration-color:rgba(0,0,0,.25)}' +
    '.empty:hover .sub u{color:rgba(0,0,0,.75);text-decoration-color:currentColor}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +
    '  background:rgba(201,100,66,.10)}' +
    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed rgba(0,0,0,.25);' +

    ':host([data-over]) .ring{border-color:#c96442}' +
    ':host([data-filled]) .ring{display:none}' +
    // Controls sit BELOW the mask (top:100%), absolutely positioned so the
    // author-declared slot height is unaffected. The gap is padding, not a
    // top offset, so the hover target stays contiguous with the frame.

    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;' +
    '  white-space:nowrap}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;' +
    '  background:rgba(0,0,0,.65);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  class ImageSlot extends HTMLElement {
    static get observedAttributes() {
      return ['shape', 'radius', 'mask', 'fit', 'position', 'placeholder', 'src', 'id'];
    }

    constructor() {
      super();
      const root = this.attachShadow({ mode: 'open' });
      // .spill and .ctl sit OUTSIDE .frame so overflow:hidden + border-radius
      // on the frame (circle, pill, rounded) can't clip them.
      root.innerHTML =
        '<style>' + stylesheet + '</style>' +
        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        '<div class="spill">' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +
        '</div>' +
        '<div class="ctl"><button data-act="replace" title="Replace image">Replace</button>' +
        '  <button data-act="clear" title="Remove image">Remove</button></div>' +
        '<input type="file" accept="' + ACCEPT.join(',') + '" hidden>';
      this._frame = root.querySelector('.frame');
      this._ring = root.querySelector('.ring');
      this._img = root.querySelector('.frame img');
      this._empty = root.querySelector('.empty');
      this._cap = root.querySelector('.cap');
      this._sub = root.querySelector('.sub');
      this._spill = root.querySelector('.spill');
      this._ghost = root.querySelector('.ghost');
      this._err = null;
      this._input = root.querySelector('input');
      this._depth = 0;
      this._gen = 0;
      this._view = { s: 1, x: 0, y: 0 };
      this._subFn = () => this._render();
      // Shadow-DOM listeners live with the shadow DOM — bound once here so
      // disconnect/reconnect (e.g. React remount) doesn't stack handlers.
      this._empty.addEventListener('click', () => this._input.click());
      root.addEventListener('click', (e) => {
        const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
        if (act === 'replace') { this._exitReframe(true); this._input.click(); }
        if (act === 'clear') {
          this._exitReframe(false);
          this._gen++;
          this._local = null;
          if (this.id) setSlot(this.id, null); else this._render();
        }
      });
      this._input.addEventListener('change', () => {
        const f = this._input.files && this._input.files[0];
        if (f) this._ingest(f);
        this._input.value = '';
      });
      // naturalWidth/Height aren't known until load — re-apply so the cover
      // baseline is computed from real dimensions, not the 100%×100% fallback.
      this._img.addEventListener('load', () => this._applyView());
      // Gated on editable + fit=cover so share links and contain/fill slots
      // stay static.
      this.addEventListener('dblclick', (e) => {
        if (!this.hasAttribute('data-editable') || !this._reframes()) return;
        e.preventDefault();
        if (this.hasAttribute('data-reframe')) this._exitReframe(true);
        else this._enterReframe();
      });
      // Pan + resize both originate on the spill layer. A handle pointerdown
      // drives an aspect-locked resize anchored at the opposite corner; any
      // other pointerdown on the spill pans. Offsets are frame-% so a
      // reframed slot survives responsive resize / PPTX export.
      this._spill.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 || !this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        e.stopPropagation();
        this._spill.setPointerCapture(e.pointerId);
        const rect = this.getBoundingClientRect();
        const fw = rect.width || 1, fh = rect.height || 1;
        const corner = e.target.getAttribute && e.target.getAttribute('data-c');
        let move;
        if (corner) {
          // Resize about the OPPOSITE corner. Viewport-px throughout (rect
          // fw/fh, not clientWidth) so the math survives a transform:scale()
          // ancestor — deck_stage renders slides scaled-to-fit.
          const iw = this._img.naturalWidth || 1, ih = this._img.naturalHeight || 1;
          const base = Math.max(fw / iw, fh / ih);
          const sx = corner.includes('e') ? 1 : -1;
          const sy = corner.includes('s') ? 1 : -1;
          const s0 = this._view.s;
          const w0 = iw * base * s0, h0 = ih * base * s0;
          const cx0 = (50 + this._view.x) / 100 * fw;
          const cy0 = (50 + this._view.y) / 100 * fh;
          const ox = cx0 - sx * w0 / 2, oy = cy0 - sy * h0 / 2;
          const diag0 = Math.hypot(w0, h0);
          const ux = sx * w0 / diag0, uy = sy * h0 / diag0;
          move = (ev) => {
            const proj = (ev.clientX - rect.left - ox) * ux +
                         (ev.clientY - rect.top - oy) * uy;
            const s = clampS(s0 * proj / diag0);
            const d = diag0 * s / s0;
            this._view.s = s;
            this._view.x = (ox + ux * d / 2) / fw * 100 - 50;
            this._view.y = (oy + uy * d / 2) / fh * 100 - 50;
            this._clampView();
            this._applyView();
          };
        } else {
          this.setAttribute('data-panning', '');
          const start = { px: e.clientX, py: e.clientY, x: this._view.x, y: this._view.y };
          move = (ev) => {
            this._view.x = start.x + (ev.clientX - start.px) / fw * 100;
            this._view.y = start.y + (ev.clientY - start.py) / fh * 100;
            this._clampView();
            this._applyView();
          };
        }
        const up = () => {
          try { this._spill.releasePointerCapture(e.pointerId); } catch {}
          this._spill.removeEventListener('pointermove', move);
          this._spill.removeEventListener('pointerup', up);
          this._spill.removeEventListener('pointercancel', up);
          this.removeAttribute('data-panning');
          this._dragUp = null;
        };
        // Stashed so _exitReframe (Escape / outside-click mid-drag) can
        // tear the capture + listeners down synchronously.
        this._dragUp = up;
        this._spill.addEventListener('pointermove', move);
        this._spill.addEventListener('pointerup', up);
        this._spill.addEventListener('pointercancel', up);
      });
      // Wheel zoom stays available inside reframe mode as a trackpad nicety —
      // zooms toward the cursor (offset' = cursor·(1-k) + offset·k).
      this.addEventListener('wheel', (e) => {
        if (!this.hasAttribute('data-reframe')) return;
        e.preventDefault();
        const r = this.getBoundingClientRect();
        const cx = (e.clientX - r.left) / r.width * 100 - 50;
        const cy = (e.clientY - r.top) / r.height * 100 - 50;
        const prev = this._view.s;
        const next = clampS(prev * Math.pow(1.0015, -e.deltaY));
        if (next === prev) return;
        const k = next / prev;
        this._view.s = next;
        this._view.x = cx * (1 - k) + this._view.x * k;
        this._view.y = cy * (1 - k) + this._view.y * k;
        this._clampView();

    }

    connectedCallback() {
      // Warn once per page — an id-less slot works for the session but
      // cannot persist, and two id-less slots would share nothing.
      if (!this.id && !ImageSlot._warned) {
        ImageSlot._warned = true;
        console.warn('<image-slot> without an id will not persist its dropped image.');
      }
      this.addEventListener('dragenter', this);
      this.addEventListener('dragover', this);
      this.addEventListener('dragleave', this);
      this.addEventListener('drop', this);
      subs.add(this._subFn);
      // width%/height% in _applyView encode the frame aspect at call time —
      // a host resize (responsive grid, pane divider) would stretch the
      // image until the next _render. Re-render on size change: _render()
      // re-seeds _view from stored before clamp/apply, so a shrink→grow
      // cycle round-trips instead of ratcheting x/y toward the narrower
      // frame's clamp range.
      this._ro = new ResizeObserver(() => this._render());
      this._ro.observe(this);

      this._render();
