    disconnectedCallback() {
      subs.delete(this._subFn);
      this.removeEventListener('dragenter', this);
      this.removeEventListener('dragover', this);
      this.removeEventListener('dragleave', this);
      this.removeEventListener('drop', this);
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      this._exitReframe(false);
    }

    _enterReframe() {
      if (this.hasAttribute('data-reframe')) return;
      this.setAttribute('data-reframe', '');
      this._applyView();
      // Close on click outside (the spill handler stopPropagation()s so
      // in-image drags don't reach this) and on Escape. Listeners are held
      // on the instance so _exitReframe / disconnectedCallback can detach
      // exactly what was attached.
      this._outside = (e) => {
        if (e.composedPath && e.composedPath().includes(this)) return;
        this._exitReframe(true);
      };
      this._esc = (e) => { if (e.key === 'Escape') this._exitReframe(true); };
      document.addEventListener('pointerdown', this._outside, true);
      document.addEventListener('keydown', this._esc, true);
    }

    _exitReframe(commit) {
      if (!this.hasAttribute('data-reframe')) return;
      if (this._dragUp) this._dragUp();
      this.removeAttribute('data-reframe');
      this.removeAttribute('data-panning');
      if (this._outside) document.removeEventListener('pointerdown', this._outside, true);
      if (this._esc) document.removeEventListener('keydown', this._esc, true);
      this._outside = this._esc = null;
      if (commit) this._commitView();
    }

    attributeChangedCallback() { if (this.shadowRoot) this._render(); }

    // handleEvent — one listener object for all four drag events keeps the
    // add/remove symmetric and the depth counter correct.
    handleEvent(e) {
      if (e.type === 'dragenter' || e.type === 'dragover') {
        // Without preventDefault the browser never fires 'drop'.
        e.preventDefault();
        e.stopPropagation();
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
        if (e.type === 'dragenter') this._depth++;
        this.setAttribute('data-over', '');
      } else if (e.type === 'dragleave') {
        // dragenter/leave fire for every descendant crossing — count depth
        // so hovering the icon inside the empty state doesn't flicker.
        if (--this._depth <= 0) { this._depth = 0; this.removeAttribute('data-over'); }
      } else if (e.type === 'drop') {
        e.preventDefault();
        e.stopPropagation();
        this._depth = 0;
        this.removeAttribute('data-over');
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (f) this._ingest(f);
      }
    }

    async _ingest(file) {
      this._setError(null);
      if (!file || ACCEPT.indexOf(file.type) < 0) {
        this._setError('Drop a PNG, JPEG, WebP, or AVIF image.');
        return;
      }
      // toDataUrl can take hundreds of ms on a large photo. A Clear or a
      // newer drop during that window would be clobbered when this await
      // resumes — bump + capture a generation so stale encodes bail.
      const gen = ++this._gen;
      try {
        const w = this.clientWidth || this.offsetWidth || MAX_DIM;
        const url = await toDataUrl(file, w);
        if (gen !== this._gen) return;
        // Only exit reframe once the new image is in hand — a rejected type
        // or decode failure leaves the in-progress crop untouched.
        this._exitReframe(false);
        const val = { u: url, s: 1, x: 0, y: 0 };
        setSlot(this.id || '', val);
        // Keep a session-local copy for id-less slots so the drop still
        // shows, even though it cannot persist.
        if (!this.id) { this._local = val; this._render(); }
      } catch (err) {
        if (gen !== this._gen) return;
        this._setError('Could not read that image.');
        console.warn('<image-slot> ingest failed:', err);
      }
    }

    _setError(msg) {
      if (this._err) { this._err.remove(); this._err = null; }
      if (!msg) return;
      const d = document.createElement('div');
      d.className = 'err'; d.textContent = msg;
      this.shadowRoot.appendChild(d);
      this._err = d;
      setTimeout(() => { if (this._err === d) { d.remove(); this._err = null; } }, 3000);
    }

    // Reframing (pan/resize) is only meaningful for fit=cover — contain/fill
    // keep the old object-fit path and double-click is a no-op.
    _reframes() {
      return this.hasAttribute('data-filled') &&
        (this.getAttribute('fit') || 'cover') === 'cover';
    }

    // Cover-baseline geometry, shared by clamp/apply/resize. Null until the
    // img has loaded (naturalWidth is 0 before that) or when the slot has no
    // layout box — ResizeObserver fires with a 0×0 rect under display:none,
    // and clamping against a degenerate 1×1 frame would silently pull the
    // stored pan toward zero.
    _geom() {
      const iw = this._img.naturalWidth, ih = this._img.naturalHeight;
      const fw = this.clientWidth, fh = this.clientHeight;
      if (!iw || !ih || !fw || !fh) return null;
      return { iw, ih, fw, fh, base: Math.max(fw / iw, fh / ih) };
    }

    _clampView() {
      // Pan range on each axis is half the overflow past the frame edge.
      const g = this._geom();
      if (!g) return;
      const mx = Math.max(0, (g.iw * g.base * this._view.s / g.fw - 1) * 50);
      const my = Math.max(0, (g.ih * g.base * this._view.s / g.fh - 1) * 50);
      this._view.x = Math.max(-mx, Math.min(mx, this._view.x));
      this._view.y = Math.max(-my, Math.min(my, this._view.y));
    }

    _applyView() {
      const g = this._geom();
      const fit = this.getAttribute('fit') || 'cover';
      if (fit !== 'cover' || !g) {
        // Non-cover, or dimensions not known yet (before img load).
        this._img.style.width = '100%';
        this._img.style.height = '100%';
        this._img.style.left = '50%';
        this._img.style.top = '50%';
        this._img.style.objectFit = fit;
        this._img.style.objectPosition = this.getAttribute('position') || '50% 50%';
        return;
      }
      // Cover baseline: img fills the frame on its tighter axis at s=1, so
      // pan works immediately on the overflowing axis without zooming first.
      // Width/height and left/top are all frame-% — depends only on the
      // frame aspect ratio, so a responsive resize keeps the same crop. The
      // spill layer mirrors the same box so its corners = image corners.
      const k = g.base * this._view.s;
      const w = (g.iw * k / g.fw * 100) + '%';
      const h = (g.ih * k / g.fh * 100) + '%';
      const l = (50 + this._view.x) + '%';
      const t = (50 + this._view.y) + '%';
      this._img.style.width = w; this._img.style.height = h;
      this._img.style.left = l; this._img.style.top = t;
      this._img.style.objectFit = '';
      this._spill.style.width = w; this._spill.style.height = h;
      this._spill.style.left = l; this._spill.style.top = t;
    }

    _commitView() {
      const v = { s: this._view.s, x: this._view.x, y: this._view.y };
      if (this._userUrl) v.u = this._userUrl;
      // Framing-only (no u) persists too so an author-src slot remembers its
      // crop; clearing the sidecar still falls through to src=.
      if (this.id) setSlot(this.id, v);
      else { this._local = v; }
    }

    _render() {
      // Shape / mask. Presets use border-radius so the dashed ring can
      // follow the rounded outline; clip-path is only applied for an
      // explicit `mask` (the ring is hidden there since a rectangle
      // dashed border chopped by an arbitrary polygon looks broken).
      const mask = this.getAttribute('mask');
      const shape = (this.getAttribute('shape') || 'rounded').toLowerCase();
      let radius = '';
      if (shape === 'circle') radius = '50%';
      else if (shape === 'pill') radius = '9999px';
      else if (shape === 'rounded') {
        const n = parseFloat(this.getAttribute('radius'));
        radius = (Number.isFinite(n) ? n : 12) + 'px';
      }
      this._frame.style.borderRadius = mask ? '' : radius;
      this._frame.style.clipPath = mask || '';
      this._ring.style.borderRadius = mask ? '' : radius;
      this._ring.style.display = mask ? 'none' : '';

      // Controls and reframe entry gate on this so share links stay read-only.
      const editable = !!(window.omelette && window.omelette.writeFile);
      this.toggleAttribute('data-editable', editable);
      this._sub.style.display = editable ? '' : 'none';

      // Content. The sidecar is also writable by the agent's write_file
      // tool, so its value isn't guaranteed canvas-originated — only accept
      // data:image/ URLs from it. The `src` attribute is author-controlled
      // (Claude wrote it into the HTML) so it passes through unchanged.
      let stored = this.id ? getSlot(this.id) : this._local;
      if (stored && stored.u && !/^data:image\//i.test(stored.u)) stored = null;
      const srcAttr = this.getAttribute('src') || '';
      this._userUrl = (stored && stored.u) || null;
      const url = this._userUrl || srcAttr;
      // Don't clobber an in-flight reframe with a store-triggered re-render.
      if (!this.hasAttribute('data-reframe')) {
        this._view = {
          s: stored && Number.isFinite(stored.s) ? clampS(stored.s) : 1,
          x: stored && Number.isFinite(stored.x) ? stored.x : 0,
          y: stored && Number.isFinite(stored.y) ? stored.y : 0,
        };
      }
      this._cap.textContent = this.getAttribute('placeholder') || 'Drop an image';
      // Toggle via style.display — the [hidden] attribute alone loses to
      // the display:flex / display:block rules in the stylesheet above.
      if (url) {
        if (this._img.getAttribute('src') !== url) {
          this._img.src = url;
          this._ghost.src = url;
        }
        this._img.style.display = 'block';
        this._empty.style.display = 'none';
        this.setAttribute('data-filled', '');
        this._clampView();
        this._applyView();
      } else {
        this._img.style.display = 'none';
        this._img.removeAttribute('src');
        this._ghost.removeAttribute('src');
        this._empty.style.display = 'flex';
        this.removeAttribute('data-filled');
      }
    }
  }

  if (!customElements.get('image-slot')) {
    customElements.define('image-slot', ImageSlot);
  }
})();

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // Hide the toggle until the host has actually enabled the rail (the
  // __omelette_rail_enabled window message, posted only when the
  // omelette_deck_rail_enabled flag is on for this user). The initial read
  // covers TweaksPanel mounting after the message already arrived; the
  // listener covers the common case of mounting first.
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>

/* ============================================================
   Reveal hook
   ============================================================ */
function useReveal() {
  React.useLayoutEffect(() => {
    let cancelled = false;
    let io = null;

    const setup = () => {
      if (cancelled) return;
      const els = document.querySelectorAll('.reveal:not(.is-visible)');
      if (!('IntersectionObserver' in window)) {
        els.forEach(el => el.classList.add('is-visible'));
        return;
      }
      io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('is-visible');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
      els.forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) {
          el.classList.add('is-visible');
        } else {
          io.observe(el);
        }
      });
    };

    const raf1 = requestAnimationFrame(() => requestAnimationFrame(setup));

    return () => {
      cancelled = true;
      cancelAnimationFrame(raf1);
      if (io) io.disconnect();
    };
  }, []);
}

/* ============================================================
   Animated counter
   ============================================================ */
function Counter({ to, suffix = '', duration = 1400 }) {
  const [val, setVal] = React.useState(0);
  const ref = React.useRef(null);
  const [start, setStart] = React.useState(false);

  React.useEffect(() => {
    if (!ref.current) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setStart(true); io.disconnect(); }
    }, { threshold: 0.4 });
    io.observe(ref.current);
    return () => io.disconnect();
  }, []);

  React.useEffect(() => {
    if (!start) return;
    const t0 = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.floor(to * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
      else setVal(to);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [start, to, duration]);

  return <span ref={ref} className="mono-num">{val}{suffix}</span>;
}

  <script type="text/babel">
/* page-products.jsx — interactive product explorer */

const PRODUCT_GROUP_IMAGES = {
  'magnetics':         'src/assets/magnetics.jpg',

  'power-electronics': 'src/assets/power-electronics.jpg',
  'cross-segment':     'src/assets/cross-segment.jpg',
};

function PageProducts({ navigate, focusId }) {
  useReveal();

  // active group + sub-category state
  const initialGroup = (focusId && PRODUCTS.find(p => p.id === focusId)) ? focusId : PRODUCTS[0].id;
  const [activeGroup, setActiveGroup] = React.useState(initialGroup);
  const [activeSubByGroup, setActiveSubByGroup] = React.useState(() =>
    PRODUCTS.reduce((acc, p) => { acc[p.id] = p.subcategories[0].code; return acc; }, {})
  );

  const group = PRODUCTS.find(p => p.id === activeGroup) || PRODUCTS[0];
  const activeSubCode = activeSubByGroup[group.id];
  const sub = group.subcategories.find(s => s.code === activeSubCode) || group.subcategories[0];
  const subDetail = (window.SUBCAT_DETAIL || SUBCAT_DETAIL)[sub.code] || {};

  React.useEffect(() => {
    if (focusId && focusId !== activeGroup && PRODUCTS.find(p => p.id === focusId)) {
      setActiveGroup(focusId);
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [focusId]);

  const selectGroup = (id) => {
    setActiveGroup(id);
    // scroll to the explorer top
    const el = document.getElementById('product-explorer');
    if (el) {
      const top = el.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top, behavior: 'smooth' });
    }
  };

  const selectSub = (code) => {
    setActiveSubByGroup(s => ({ ...s, [group.id]: code }));
    // scroll to detail panel on mobile
    if (window.matchMedia('(max-width: 1000px)').matches) {
      const el = document.getElementById('subcat-detail');
      if (el) {
        const top = el.getBoundingClientRect().top + window.scrollY - 80;
        setTimeout(() => window.scrollTo({ top, behavior: 'smooth' }), 80);
      }
    }
  };

  return (
    <main className="page-enter">

        <div className="container">
          <div className="mono">02 / Products and Solutions</div>

          </p>
        </div>
      </section>

      {/* EXPLORER */}
      <section className="section" id="product-explorer">
        <div className="container">

          {/* Mobile-only horizontal group tabs */}
          <nav className="prodx-tabs" aria-label="Select product group">
            {PRODUCTS.map(p => (
              <button
                key={p.id}
                className={`prodx-tab ${activeGroup === p.id ? 'is-active' : ''}`}
                onClick={() => selectGroup(p.id)}
                aria-current={activeGroup === p.id ? 'true' : undefined}
              >
                <span className="mono num">{p.num}</span>
                <span>{p.name}</span>
              </button>
            ))}
          </nav>

          <div className="prodx-layout">

            {/* LEFT — Group nav */}
            <aside className="prodx-rail" aria-label="Product groups">

                <div className="mono" style={{ color: 'var(--accent)', fontWeight: 600 }}>{PRODUCTS.length}</div>
              </div>
              {PRODUCTS.map(p => (
                <button
                  key={p.id}
                  className={`prodx-rail-item ${activeGroup === p.id ? 'is-active' : ''}`}
                  onClick={() => selectGroup(p.id)}
                  aria-current={activeGroup === p.id ? 'true' : undefined}
                >
                  <span className="num">{p.num}</span>
                  <span className="name">{p.name}</span>
                  <span className="count mono">{p.subcategories.length}</span>
                </button>
              ))}

              <div className="prodx-rail-cta">

                  Talk to engineering
                </button>
              </div>
            </aside>

            {/* RIGHT — Group overview + sub-cat explorer + detail */}

              {/* Group header */}
              <header className="prodx-group-head">
                <div className="prodx-group-num">{group.num}</div>

                  <div className="mono" style={{ color: 'var(--accent)', fontWeight: 600 }}>Product group {group.num}</div>
                  <h2>{group.name}</h2>
                  <p className="lead">{group.tagline}</p>

              </header>

                  <div className="mono" style={{ color: 'var(--ink-muted)', marginBottom: 8 }}>Where it is used</div>

                    {group.industries.slice(0, 4).map(iid => {

                  <span style={{ fontFamily: 'var(--font-mono)', fontSize: 20, color: 'var(--accent)', fontWeight: 300, flexShrink: 0, transition: 'transform 250ms', transform: openFaq === i ? 'rotate(45deg)' : 'none', display: 'inline-block' }}>+</span>
                </button>
                {openFaq === i && (
                  <div style={{ padding: '0 28px 24px', borderTop: '1px solid var(--rule-soft)' }}>
                    <p style={{ fontSize: 14, lineHeight: 1.7, color: 'var(--ink-soft)', paddingTop: 16 }}>{item.a}</p>

                Share your product category, destination country, quantity and required standard. Our export team will acknowledge within 24 working hours.

              {/* Step indicators */}
              <div style={{ display: 'flex', gap: 6, marginTop: 36, marginBottom: 28, flexWrap: 'wrap' }}>
                {['Product', 'Destination', 'Quantity', 'Standard'].map((label, i) => (
                  <button key={i} onClick={() => setRfqStep(i + 1)} style={{ padding: '8px 14px', background: rfqStep === i + 1 ? 'var(--ink)' : rfqStep > i + 1 ? 'var(--accent)' : 'var(--bg-alt)', color: rfqStep >= i + 1 ? 'var(--bg)' : 'var(--ink-muted)', fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.08em', textTransform: 'uppercase', fontWeight: 600, border: '1px solid var(--rule)', cursor: 'pointer', transition: 'all 200ms' }}>
                    {String(i + 1).padStart(2, '0')} {label}
                  </button>
                ))}
              </div>

              {rfqStep === 1 && (
                <div className="form-row">
                  <label>Product Group</label>
                  <select value={rfqData.product} onChange={e => setRfqData({ ...rfqData, product: e.target.value })}>
                    <option value="">Select product group</option>
                    <option value="magnetics">Magnetics</option>
                    <option value="dc">DC Systems and Chargers</option>
                    <option value="panels">Panels and Assemblies</option>

                  <div style={{ marginTop: 20 }}>
                    <button className="btn btn-primary" onClick={() => setRfqStep(2)}>Next: Destination <span className="arrow">→</span></button>
                  </div>

              )}

              {rfqStep === 2 && (
                <div className="form-row">
                  <label>Destination Country</label>

                  <div style={{ display: 'flex', gap: 12, marginTop: 20 }}>
                    <button className="btn btn-secondary" onClick={() => setRfqStep(1)}>Back</button>
                    <button className="btn btn-primary" onClick={() => setRfqStep(3)}>Next: Quantity <span className="arrow">→</span></button>

              )}

              {rfqStep === 3 && (

              {/* SLA notice */}
              <div style={{ marginTop: 28, padding: '13px 20px', background: 'var(--accent-soft)', border: '1px solid rgba(184,96,44,0.35)', display: 'flex', gap: 12, alignItems: 'center' }}>
                <span className="mono" style={{ color: 'var(--accent)', fontWeight: 600, flexShrink: 0 }}>SLA</span>

              </div>
            </div>

            {/* Right: contact options and checklist */}
            <div>
              <div className="mono" style={{ color: 'var(--ink-muted)', marginBottom: 16 }}>Additional contact options</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 40 }}>
                {[
                  { label: 'Email Export Team',           sub: 'export@dynalektric.com (placeholder)' },
                  { label: 'Live Chat',                   sub: 'Available during business hours' },

                  { label: 'Download Export Catalogue',   sub: 'PDF available on request' },

                  <button key={i} onClick={() => navigate('contact')}
                    style={{ background: 'var(--bg-alt)', border: '1px solid var(--rule)', padding: '16px 20px', textAlign: 'left', cursor: 'pointer', transition: 'border-color 200ms', display: 'flex', flexDirection: 'column', gap: 4 }}

                    <span style={{ fontSize: 12, color: 'var(--ink-muted)' }}>{opt.sub}</span>

              <div className="mono" style={{ color: 'var(--ink-muted)', marginBottom: 16 }}>Useful to include in your enquiry</div>
              <div className="export-final-checklist">

      <Footer navigate={navigate} />

}

  <script type="text/babel">
/* page-contact.jsx — Structured RFQ and enquiry */

const REQ_TYPES = [
  'New requirement',
  'Replacement',
  'Custom modification',
  'Technical clarification',
  'Supplier qualification',
  'Export enquiry',
];

const QTY_RANGES = [
  'Prototype',
  'Small batch',
  'Production scale',
  'Not confirmed',
];

const INDUSTRY_OPTS = [
  { id: 'railways',    label: 'Railway & Traction' },
  { id: 'renewables',  label: 'Renewable Sectors' },
  { id: 'powergrid',   label: 'Power & Utilities' },
  { id: 'heavy',       label: 'Heavy Industries' },
  { id: 'mhe',         label: 'Material Handling & Warehousing' },
  { id: 'datacenter',  label: 'Data Centers' },
  { id: 'other',       label: 'Other' },
];

const ACCEPTED_FILE_TYPES = '.pdf,.doc,.docx,.xls,.xlsx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

function PageContact({ navigate }) {
  useReveal();
  const [form, setForm] = React.useState({
    name: '', company: '', email: '', phone: '', country: '',
    product: '', industry: '', reqType: '', qty: '',
    message: '',
  });
  const [file, setFile] = React.useState(null);
  const [fileError, setFileError] = React.useState('');
  const [errors, setErrors] = React.useState({});
  const [submitted, setSubmitted] = React.useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const onFileChange = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) { setFile(null); setFileError(''); return; }
    const okTypes = ['pdf', 'doc', 'docx', 'xls', 'xlsx'];
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (!okTypes.includes(ext)) {
      setFileError('Please upload a PDF, Word or Excel file.');
      setFile(null);
      e.target.value = '';
      return;
    }
    if (f.size > 8 * 1024 * 1024) {
      setFileError('Please keep the file under 8 MB.');
      setFile(null);
      e.target.value = '';
      return;
    }
    setFile(f);
    setFileError('');
  };

  const clearFile = () => {
    setFile(null);
    setFileError('');
    const input = document.getElementById('rfq-file-input');
    if (input) input.value = '';
  };

  const submit = (e) => {
    e.preventDefault();
    const errs = {};
    if (!form.name.trim())    errs.name    = 'Required';
    if (!form.company.trim()) errs.company = 'Required';
    if (!form.email.trim())   errs.email   = 'Required';
    else if (!/.+@.+\..+/.test(form.email)) errs.email = 'Invalid email';
    if (!form.country.trim()) errs.country = 'Required';
    if (!form.message.trim()) errs.message = 'Required';
    setErrors(errs);
    if (Object.keys(errs).length === 0) {
      // CRM-ready payload (logged for prototype). In production this would
      // POST to a CRM endpoint; on failure the form would email sales01@dynalektric.com.
      const payload = {
        leadSource: 'Website RFQ',
        name: form.name,
        company: form.company,
        email: form.email,
        phone: form.phone,
        country: form.country,
        productInterest: form.product,
        industry: form.industry,
        requirementType: form.reqType,
        quantityRange: form.qty,
        message: form.message,
        uploadedDocument: file ? { name: file.name, size: file.size, type: file.type } : null,
        receivedAt: new Date().toISOString(),
      };
      // eslint-disable-next-line no-console
      console.log('RFQ payload', payload);
      setSubmitted(true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  };

  /* ============================
     Success state
     ============================ */
  if (submitted) {
    return (
      <main className="page-enter">
        <section className="page-hero">
          <div className="container">
            <div className="mono">06 / Contact and RFQ</div>
            <h1>Thank you. Your requirement has been received.</h1>
          </div>
        </section>
        <section className="section">
          <div className="container">
            <div className="success-state">
              <div className="check">✓</div>
              <h2 style={{ marginBottom: 16 }}>Your requirement has been received.</h2>
              <p className="lead" style={{ margin: '0 auto 24px' }}>
                Thank you. Our team will review the details and respond with the next steps within one business day.
              </p>
              <div className="success-summary">
                <div className="mono" style={{ color: 'var(--ink-muted)', marginBottom: 12 }}>Submission reference</div>
                <div className="success-row">
                  <span className="mono">Lead source</span>
                  <span>Website RFQ</span>
                </div>
                {form.product && (
                  <div className="success-row">
                    <span className="mono">Product interest</span>
                    <span>{(PRODUCTS.find(p => p.id === form.product) || {}).name || form.product}</span>
                  </div>
                )}
                {form.industry && (
                  <div className="success-row">
                    <span className="mono">Industry</span>
                    <span>{(INDUSTRY_OPTS.find(i => i.id === form.industry) || {}).label || form.industry}</span>
                  </div>
                )}
                {form.reqType && (
                  <div className="success-row">
                    <span className="mono">Requirement type</span>
                    <span>{form.reqType}</span>
                  </div>
                )}
                {form.qty && (
                  <div className="success-row">
                    <span className="mono">Quantity range</span>
                    <span>{form.qty}</span>
                  </div>
                )}
                {file && (
                  <div className="success-row">
                    <span className="mono">Document</span>
                    <span>{file.name}</span>
                  </div>
                )}
              </div>
              <div style={{ display: 'flex', gap: 16, justifyContent: 'center', flexWrap: 'wrap', marginTop: 32 }}>
                <button className="btn btn-secondary" onClick={() => {
                  setSubmitted(false);
                  setForm({ name: '', company: '', email: '', phone: '', country: '', product: '', industry: '', reqType: '', qty: '', message: '' });
                  setFile(null);
                  setErrors({});
                }}>Submit another</button>
                <button className="btn btn-primary" onClick={() => navigate('home')}>Back to home <span className="arrow">→</span></button>
              </div>
            </div>
          </div>
        </section>
        <Footer navigate={navigate} />
      </main>
    );
  }

  /* ============================
     Form
     ============================ */
  return (
    <main className="page-enter">
      <section className="page-hero">
        <div className="container">
          <div className="mono">06 / Contact and RFQ</div>
          <h1>Submit RFQ or enquiry.</h1>
          <p className="lead">
            Share your product requirement, application details and a supporting document. Our team will review and respond with the next steps.
          </p>
        </div>
      </section>

      <section className="container">
        <div className="contact-grid">
          <form className="contact-form reveal" onSubmit={submit} noValidate>
            <div className="form-section-head">
              <div className="mono" style={{ color: 'var(--accent)', fontWeight: 600 }}>01 / Contact</div>
              <h3>Tell us who you are.</h3>
            </div>

            <div className="contact-form-row">
              <div className="form-row">
                <label>Name *</label>
                <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="Full name" />
                {errors.name && <span className="form-err">{errors.name}</span>}
              </div>
              <div className="form-row">
                <label>Company *</label>
                <input value={form.company} onChange={e => set('company', e.target.value)} placeholder="Organisation name" />
                {errors.company && <span className="form-err">{errors.company}</span>}
              </div>
            </div>
            <div className="contact-form-row">
              <div className="form-row">
                <label>Email *</label>
                <input type="email" value={form.email} onChange={e => set('email', e.target.value)} placeholder="you@company.com" />
                {errors.email && <span className="form-err">{errors.email}</span>}
              </div>
              <div className="form-row">
                <label>Phone</label>
                <input value={form.phone} onChange={e => set('phone', e.target.value)} placeholder="+ country code, number" />
              </div>
            </div>
            <div className="form-row">
              <label>Country *</label>
              <input value={form.country} onChange={e => set('country', e.target.value)} placeholder="e.g. Germany, UAE, USA, India" />
              {errors.country && <span className="form-err">{errors.country}</span>}
            </div>

            <div className="form-section-head" style={{ marginTop: 32 }}>
              <div className="mono" style={{ color: 'var(--accent)', fontWeight: 600 }}>02 / Requirement</div>
              <h3>Tell us what you need.</h3>
            </div>

            <div className="contact-form-row">
              <div className="form-row">
                <label>Product interest</label>
                <select value={form.product} onChange={e => set('product', e.target.value)}>
                  <option value="">Select a product group</option>
                  {PRODUCTS.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                  <option value="notsure">Not sure</option>
                </select>
              </div>
              <div className="form-row">
                <label>Industry or application</label>
                <select value={form.industry} onChange={e => set('industry', e.target.value)}>
                  <option value="">Select an industry</option>
                  {INDUSTRY_OPTS.map(i => <option key={i.id} value={i.id}>{i.label}</option>)}
                </select>
              </div>
            </div>

            <div className="contact-form-row">
              <div className="form-row">
                <label>Requirement type</label>
                <select value={form.reqType} onChange={e => set('reqType', e.target.value)}>
                  <option value="">Select requirement type</option>
                  {REQ_TYPES.map(r => <option key={r} value={r}>{r}</option>)}
                </select>
              </div>
              <div className="form-row">
                <label>Quantity range</label>
                <select value={form.qty} onChange={e => set('qty', e.target.value)}>
                  <option value="">Select quantity range</option>
                  {QTY_RANGES.map(q => <option key={q} value={q}>{q}</option>)}
                </select>
              </div>
            </div>

            <div className="form-row">
              <label>Message or requirement details *</label>
              <textarea
                rows="5"
                value={form.message}
                onChange={e => set('message', e.target.value)}
                placeholder="Application, specification, ratings, environment, timeline."
              ></textarea>
              {errors.message && <span className="form-err">{errors.message}</span>}
            </div>

            <div className="form-row">
              <label>Supporting document</label>
              <div className="rfq-upload">
                <input
                  id="rfq-file-input"
                  type="file"
                  accept={ACCEPTED_FILE_TYPES}
                  onChange={onFileChange}
                  hidden
                />
                {!file ? (
                  <label htmlFor="rfq-file-input" className="rfq-upload-btn">
                    <span className="mono">+</span>
                    <span>Choose a file</span>
                  </label>
                ) : (
                  <div className="rfq-upload-file">
                    <div>
                      <div style={{ fontSize: 13, fontWeight: 500 }}>{file.name}</div>
                      <div className="mono" style={{ color: 'var(--ink-muted)', marginTop: 2 }}>
                        {Math.ceil(file.size / 1024)} KB
                      </div>
                    </div>
                    <button type="button" className="rfq-upload-remove" onClick={clearFile} aria-label="Remove file">
                      Remove
                    </button>
                  </div>
                )}
              </div>
              <p className="rfq-upload-note">
                Please upload one supporting document in PDF, Word or Excel format. Large drawing files are not required at this stage.
              </p>
              {fileError && <span className="form-err">{fileError}</span>}
            </div>

            <div className="form-footer">
              <p style={{ fontSize: 12, color: 'var(--ink-muted)', maxWidth: '46ch' }}>
                Your details are used only to respond to this enquiry. They are not shared with third parties. Final supply terms are subject to engineering review.
              </p>
              <button type="submit" className="btn btn-primary">Submit RFQ <span className="arrow">→</span></button>
            </div>
          </form>

          <aside className="contact-info reveal">
            <div className="contact-info-block">
              <div className="label">Sales enquiries</div>
              <div className="value">sales01@dynalektric.com</div>
            </div>
            <div className="contact-info-block">
              <div className="label">General email</div>
              <div className="value">enquiry@dynalektric.com</div>
            </div>
            <div className="contact-info-block">
              <div className="label">Phone</div>
              <div className="value">+91 (placeholder)</div>
            </div>
            <div className="contact-info-block">
              <div className="label">Address</div>
              <div className="value">Dynalektric Pvt. Ltd.<br />Manufacturing facility<br />India (placeholder)</div>
            </div>
            <div className="contact-info-block">
              <div className="label">Working hours</div>
              <div className="value">Mon to Sat, 09:00 to 18:00 IST</div>
            </div>
            <div className="contact-info-block">
              <div className="label">For procurement teams</div>
              <div className="value" style={{ fontSize: 14, color: 'var(--ink-soft)', lineHeight: 1.5 }}>
                Request our supplier qualification pack, ISO certificates and sample test reports by email.
              </div>
            </div>
            <div className="contact-info-block">
              <div className="label">Response window</div>
              <div className="value" style={{ fontSize: 14, color: 'var(--ink-soft)', lineHeight: 1.5 }}>
                One business day for complete specifications. Larger scopes may take longer, subject to engineering review.
              </div>
            </div>
            <div className="contact-map placeholder-stripe">
              <span>Map placeholder</span>
            </div>
          </aside>
        </div>
      </section>

      <Footer navigate={navigate} />
    </main>
  );
}

window.PageContact = PageContact;

  </script>

  <script type="text/babel">

  "accent": 0,
  "typography": "corp",
  "heroVariant": 0,
  "texture": "clean",
  "density": "comfortable"
}/*EDITMODE-END*/;

const ACCENT_OPTIONS = [
  ['#0077B6', '#003366'], // azure + navy (default)
  ['#003366', '#0077B6'], // navy primary
  ['#0E2A47', '#0077B6'], // deep navy mono
  ['#0E7C86', '#003366'], // teal + navy

const NAV = [
  { id: 'home',       label: 'Home' },

/* SEO metadata per route */
const PAGE_META = {

    title: 'Dynalektric | Electrical and Electronics Solutions for Industrial Applications',
    description: 'Dynalektric provides engineered electrical and electronics solutions for railways, renewables, utilities, material handling and industrial applications.',
    path: '/',
  },

const SITE_ORIGIN = 'https://www.dynalektric.com';

function updateDocumentMeta(pageId) {
  const meta = PAGE_META[pageId] || PAGE_META.home;
  document.title = meta.title;

  const setMeta = (selector, attr, value) => {
    const el = document.querySelector(selector);
    if (el) el.setAttribute(attr, value);
  };
  setMeta('meta[name="description"]', 'content', meta.description);
  setMeta('meta[property="og:title"]', 'content', meta.title);
  setMeta('meta[property="og:description"]', 'content', meta.description);
  setMeta('meta[property="og:url"]', 'content', SITE_ORIGIN + meta.path);
  setMeta('meta[name="twitter:title"]', 'content', meta.title);
  setMeta('meta[name="twitter:description"]', 'content', meta.description);
  setMeta('link[rel="canonical"]', 'href', SITE_ORIGIN + meta.path);
}

function App() {
  const tw = useTweaks(TWEAK_DEFAULTS);
  const t = tw.values;
  const setTweak = tw.set;

  const [page, setPage] = React.useState('home');
  const [focusId, setFocusId] = React.useState(null);
  const [drawerOpen, setDrawerOpen] = React.useState(false);

  // SEO: update document title + meta per route
  React.useEffect(() => {
    updateDocumentMeta(page);
  }, [page]);

  // Apply tweaks to body
  React.useEffect(() => {
    const accent = ACCENT_OPTIONS[t.accent] || ACCENT_OPTIONS[0];
    const root = document.documentElement;
    if (typeof t.accent === 'number') {
      root.style.setProperty('--accent', accent[0]);
      root.style.setProperty('--accent-2', accent[1]);
    } else if (typeof t.accent === 'string') {
      root.style.setProperty('--accent', t.accent);
    }
    document.body.dataset.texture = t.texture || 'clean';
    document.body.dataset.density = t.density || 'comfortable';

    // Typography
    const typo = t.typography || 'corp';
    if (typo === 'corp') {
      root.style.setProperty('--font-display', "'Montserrat', 'Helvetica Neue', Arial, sans-serif");
      root.style.setProperty('--font-body', "'Source Sans Pro', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif");
    } else if (typo === 'montserrat') {
      root.style.setProperty('--font-display', "'Montserrat', 'Helvetica Neue', Arial, sans-serif");
      root.style.setProperty('--font-body', "'Montserrat', 'Helvetica Neue', Arial, sans-serif");
    } else if (typo === 'sourcesans') {
      root.style.setProperty('--font-display', "'Source Sans Pro', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif");
      root.style.setProperty('--font-body', "'Source Sans Pro', 'Source Sans 3', 'Helvetica Neue', Arial, sans-serif");
    } else if (typo === 'system') {
      root.style.setProperty('--font-display', "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif");
      root.style.setProperty('--font-body', "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif");
    }
  }, [t.accent, t.texture, t.density, t.typography]);

  const navigate = (id, focus = null) => {
    setPage(id);
    setFocusId(focus);
    setDrawerOpen(false);
    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  const renderPage = () => {
    const props = { navigate, focusId, tweaks: t };
    switch (page) {
      case 'home':       return <PageHome {...props} />;
      case 'about':      return <PageAbout {...props} />;
      case 'products':   return <PageProducts {...props} />;
      case 'industries': return <PageIndustries {...props} />;
      case 'rnd':        return <PageRnd {...props} />;
      case 'export':     return <PageExport {...props} />;
      case 'contact':    return <PageContact {...props} />;
      default:           return <PageHome {...props} />;
    }
  };

function DynaTweaksPanel({ t, setTweak }) {
  return (
    <TweaksPanel title="Tweaks">
      <TweakSection title="Accent palette">
        <TweakColor
          label="Accent pair"
          value={typeof t.accent === 'number' ? t.accent : 0}
          options={ACCENT_OPTIONS}
          onChange={v => setTweak('accent', v)}
        />
      </TweakSection>

      <TweakSection title="Typography">
        <TweakSelect
          label="Type pairing"
          value={t.typography}
          options={[
            { label: 'Montserrat + Source Sans (default)', value: 'corp' },
            { label: 'Montserrat only', value: 'montserrat' },
            { label: 'Source Sans only', value: 'sourcesans' },
            { label: 'System sans', value: 'system' },
          ]}
          onChange={v => setTweak('typography', v)}
        />
      </TweakSection>

      <TweakSection title="Hero headline">
        <TweakRadio
          label="Variant"
          value={t.heroVariant}
          options={[
            { label: 'A', value: 0 },
            { label: 'B', value: 1 },
            { label: 'C', value: 2 },
          ]}
          onChange={v => setTweak('heroVariant', v)}
        />
        <div style={{ fontSize: 11, color: 'rgba(255,255,255,0.5)', fontFamily: 'monospace', letterSpacing: '0.05em', textTransform: 'uppercase', marginTop: 8 }}>
          {t.heroVariant === 0 && 'OEM and EPC focused'}
          {t.heroVariant === 1 && 'Specification first'}
          {t.heroVariant === 2 && 'Supplier qualification ready'}
        </div>
      </TweakSection>

      <TweakSection title="Background texture">
        <TweakRadio
          label="Surface"
          value={t.texture}
          options={[
            { label: 'Clean', value: 'clean' },
            { label: 'Grid', value: 'grid' },
            { label: 'Dots', value: 'dots' },
          ]}
          onChange={v => setTweak('texture', v)}
        />
      </TweakSection>

      <TweakSection title="Density">
        <TweakRadio
          label="Spacing"
          value={t.density}
          options={[
            { label: 'Comfortable', value: 'comfortable' },
            { label: 'Compact', value: 'compact' },
          ]}
          onChange={v => setTweak('density', v)}
        />
      </TweakSection>
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
