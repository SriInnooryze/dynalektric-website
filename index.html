  <style>/* ============================================================
   Dynalektric — Editorial Industrial Design System
   ============================================================ */

:root {
  /* Bone-white base, deep ink text */
  --bg: #F6F4EF;
  --bg-alt: #EFEDE6;
  --bg-card: #FFFFFF;
  --ink: #0E1116;
  --ink-soft: #2A2D33;
  --ink-muted: #6B6E74;
  --rule: #D9D5CB;
  --rule-soft: #E5E2D9;

  /* Dual accent - copper + ink-blue, refined chroma */
  --accent: #B8602C;
  --accent-hover: #A0521E;
  --accent-soft: #EFD9C8;
  --accent-2: #1F3A5F;
  --accent-2-soft: #DCE3EE;

  /* Typography */
  --font-display: 'Söhne', 'Inter Display', 'Inter', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Inter', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  /* Density */
  --section-y: 120px;
  --container-max: 1360px;
  --gutter: 64px;

  /* Effects */
  --radius: 2px;
  --radius-card: 4px;
  --shadow-card: 0 1px 2px rgba(14,17,22,0.04), 0 8px 24px rgba(14,17,22,0.04);
  --shadow-card-hover: 0 1px 2px rgba(14,17,22,0.05), 0 16px 40px rgba(14,17,22,0.08);
}

@media (max-width: 1200px) {
  :root { --gutter: 48px; }
}

@media (max-width: 768px) {
  :root { --gutter: 24px; --section-y: 80px; }
  h1 { font-size: clamp(36px, 10vw, 48px); }
  h2 { font-size: clamp(28px, 8vw, 36px); }
}

[data-density="compact"] {
  --section-y: 80px;
  --gutter: 24px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

/* Suppress standalone-bundler error toast — video/font load failures are non-fatal */
#__bundler_err { display: none !important; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

/* Background textures */
body[data-texture="grid"]::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(to right, rgba(14,17,22,0.025) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(14,17,22,0.025) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
  z-index: 0;
}
body[data-texture="dots"]::before {
  content: '';
  position: fixed; inset: 0;
  background-image: radial-gradient(rgba(14,17,22,0.07) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* App root sits above texture */
#app { position: relative; z-index: 1; }

/* Typography */
h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-wrap: balance;
}
h1 { font-size: clamp(42px, 5.5vw, 92px); line-height: 0.96; letter-spacing: -0.035em; font-weight: 450; }
h2 { font-size: clamp(32px, 3.5vw, 56px); line-height: 1.02; letter-spacing: -0.025em; }
h3 { font-size: clamp(20px, 1.8vw, 28px); line-height: 1.15; letter-spacing: -0.015em; }
h4 { font-size: 18px; line-height: 1.3; letter-spacing: -0.01em; }

p { color: var(--ink-soft); text-wrap: pretty; }
.lead { font-size: 20px; line-height: 1.5; color: var(--ink-soft); max-width: 60ch; }

/* Mono utilities */
.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); font-weight: 500; }
.mono-num { font-family: var(--font-mono); font-feature-settings: 'tnum'; }

/* Layout */
.container {
  max-width: var(--container-max);
  margin: 0 auto;
  padding: 0 var(--gutter);
}
.section { padding: var(--section-y) 0; }
.section-tight { padding: calc(var(--section-y) * 0.6) 0; }

.rule { height: 1px; background: var(--rule); border: 0; }
.rule-soft { height: 1px; background: var(--rule-soft); border: 0; }

/* Section header pattern */
.section-head {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: var(--gutter);
  align-items: end;
  padding-bottom: 48px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 64px;
}
.section-head .eyebrow { display: flex; align-items: center; gap: 12px; }
.section-head .eyebrow .num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.section-head .eyebrow .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); }
@media (max-width: 800px) {
  .section-head { grid-template-columns: 1fr; gap: 24px; }
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 200ms cubic-bezier(.2,.8,.2,1);
  text-decoration: none;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink);
  color: var(--bg);
}
.btn-primary:hover {
  background: var(--accent);
  transform: translateY(-1px);
}
.btn-primary .arrow { transition: transform 200ms; }
.btn-primary:hover .arrow { transform: translateX(4px); }

.btn-secondary {
  background: transparent;
  color: var(--ink);
  border-color: var(--ink);
}
.btn-secondary:hover {
  background: var(--ink);
  color: var(--bg);
}

.btn-ghost {
  background: transparent;
  color: var(--ink);
  padding: 14px 0;
  border-bottom: 1px solid var(--ink);
  border-radius: 0;
}
.btn-ghost:hover { color: var(--accent); border-color: var(--accent); }

/* Reveal on scroll */
.reveal { opacity: 0; transform: translateY(24px); transition: opacity 700ms cubic-bezier(.2,.8,.2,1), transform 700ms cubic-bezier(.2,.8,.2,1); }
.reveal.is-visible { opacity: 1; transform: translateY(0); }

/* Top bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(246,244,239,0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--rule-soft);
}
.topbar-inner {
  display: grid;
  /* minmax(0,1fr) lets the nav column shrink below its content size,
     preventing the grid from expanding past the topbar boundary */
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 24px;
  padding: 18px var(--gutter);
  max-width: var(--container-max);
  margin: 0 auto;
}
.topbar-logo { display: flex; align-items: center; height: 36px; }
.topbar-logo img { height: 32px; width: auto; display: block; }
.topbar-nav {
  display: flex;
  gap: 4px;
  justify-content: center;
  min-width: 0;      /* allows the flex container to shrink within the 1fr column */
  overflow: hidden;  /* hard containment: flex content cannot escape the grid cell */
}
.nav-link {
  background: none;
  border: 0;
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--ink-muted);
  /* --_np is the single source of truth for horizontal padding.
     Both padding and the ::after underline inset read from it,
     so the underline is always exactly text-width regardless of
     which breakpoint or which label is active. */
  --_np: 14px;
  padding: 8px var(--_np);
  border-radius: var(--radius);
  cursor: pointer;
  transition: color 150ms;
  position: relative;
  white-space: nowrap;
}
.nav-link:hover { color: var(--ink); }
.nav-link[aria-current="page"] { color: var(--ink); }

/* Shared underline element — present on all links, invisible by default.
   Scales in from center on hover; stays open on the active page.
   left/right track --_np so the line always aligns with the text edges. */
.nav-link::after {
  content: '';
  position: absolute;
  left: var(--_np);
  right: var(--_np);
  bottom: 2px;
  height: 1px;
  background: var(--accent);
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 200ms cubic-bezier(.2,.8,.2,1);
}
.nav-link:hover::after,
.nav-link[aria-current="page"]::after {
  transform: scaleX(1);
}
.topbar-cta {
  display: flex;
  gap: 12px;
  align-items: center;
}
.topbar-meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); letter-spacing: 0.1em; }

/* Nav collapses to hamburger at ≤1100 px — below this width 7 long labels
   cannot fit on one row. RFQ button remains visible at 901–1100 px. */
@media (max-width: 1100px) {
  .topbar-nav { display: none; }
  .topbar-meta { display: none; }
}
@media (max-width: 900px) {
  /* Hide RFQ button only at true mobile widths — hamburger + menu is enough */
  .topbar-cta .btn { display: none; }
}

/* Mobile menu button */
.menu-btn {
  display: none;
  background: none;
  border: 1px solid var(--rule);
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 2px;
}
@media (max-width: 1100px) {
  .menu-btn { display: block; }
}

/* Mobile drawer */
.mobile-drawer {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 100;
  padding: 80px var(--gutter) var(--gutter);
  display: flex;
  flex-direction: column;
  gap: 4px;
  transform: translateY(-100%);
  transition: transform 300ms cubic-bezier(.2,.8,.2,1);
}
.mobile-drawer.is-open { transform: translateY(0); }
.mobile-drawer .nav-link { font-size: 28px; padding: 16px 0; text-align: left; font-family: var(--font-display); font-weight: 500; letter-spacing: -0.02em; }
.mobile-drawer .nav-link::after { display: none; } /* underline not applicable in full-screen drawer */
.mobile-drawer .close-btn {
  position: absolute;
  top: 18px; right: var(--gutter);
}

/* Footer */
.footer {
  background: var(--ink);
  color: var(--bg);
  padding: 80px 0 32px;
  margin-top: var(--section-y);
}
.footer h4 { color: var(--bg); font-size: 13px; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 500; opacity: 0.6; margin-bottom: 20px; }
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; padding-bottom: 64px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.footer-col a { color: rgba(246,244,239,0.7); text-decoration: none; font-size: 14px; transition: color 150ms; cursor: pointer; }
.footer-col a:hover { color: var(--accent); }
.footer-bottom { padding-top: 24px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: rgba(246,244,239,0.5); }
.footer-bottom span { text-transform: uppercase; }
.footer-brand { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.02em; margin-bottom: 16px; }
.footer-tag { color: rgba(246,244,239,0.7); font-size: 14px; max-width: 36ch; line-height: 1.6; }
@media (max-width: 800px) {
  .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; }
  .footer-bottom { flex-direction: column; gap: 12px; align-items: flex-start; }
}

/* Card primitive */
.card {
  background: var(--bg-card);
  border: 1px solid var(--rule-soft);
  border-radius: var(--radius-card);
  transition: transform 300ms cubic-bezier(.2,.8,.2,1), box-shadow 300ms, border-color 300ms;
}
.card:hover {
  border-color: var(--rule);
  box-shadow: var(--shadow-card-hover);
  transform: translateY(-2px);
}

/* Image slot defaults */
image-slot {
  --slot-bg: var(--bg-alt);
  --slot-border: var(--rule);
  --slot-fg: var(--ink-muted);
  background: var(--bg-alt);
}

/* Striped placeholder for non-image slots */
.placeholder-stripe {
  background: repeating-linear-gradient(
    -45deg,
    var(--bg-alt),
    var(--bg-alt) 8px,
    transparent 8px,
    transparent 16px
  ), var(--bg-card);
  border: 1px solid var(--rule);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}

/* Page transition */
.page-enter { animation: pageIn 400ms cubic-bezier(.2,.8,.2,1); }
@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Tweaks panel positioning override */
.tweaks-panel { z-index: 200 !important; }

/* Form elements */
.form-row { display: flex; flex-direction: column; gap: 8px; }
.form-row label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.form-row input,
.form-row select,
.form-row textarea {
  font-family: var(--font-body);
  font-size: 16px;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--rule);
  padding: 12px 0;
  color: var(--ink);
  outline: none;
  transition: border-color 200ms;
  width: 100%;
  resize: vertical;
}
.form-row input:focus,
.form-row select:focus,
.form-row textarea:focus {
  border-bottom-color: var(--accent);
}
.form-row input::placeholder,
.form-row textarea::placeholder { color: var(--ink-muted); }

/* Big number display */
.big-num {
  font-family: var(--font-display);
  font-size: clamp(56px, 7vw, 96px);
  font-weight: 350;
  letter-spacing: -0.04em;
  line-height: 1;
  color: var(--ink);
}

/* Accent dot */
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }

/* Engineering visual — abstract */
.eng-visual {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1.1;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  overflow: hidden;
}

  <style>/* page-styles.css — page-specific styling */

/* HERO */
.hero-meta {
  display: flex;
  gap: 32px;
  flex-wrap: wrap;
  align-items: center;
}
.hero-meta .mono { color: var(--ink-muted); }

.hero-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 64px;
  align-items: end;
}
.hero-copy h1 { max-width: 14ch; }

.hero-visual {
  position: relative;
}
.hero-visual-frame {
  position: relative;
  border: 1px solid var(--rule);
  background: var(--bg-card);
  aspect-ratio: 1 / 1.1;
  overflow: hidden;
}
.hero-visual-badge {
  position: absolute;
  top: 16px; left: 16px;
  background: var(--bg);
  border: 1px solid var(--rule);
  padding: 6px 10px;
  display: flex;
  gap: 16px;
  align-items: center;
}
.hero-visual-corner {
  position: absolute;
  width: 12px; height: 12px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-visual-corner.top-left { top: 6px; left: 6px; }
.hero-visual-corner.top-right { top: 6px; right: 6px; }
.hero-visual-corner.bottom-left { bottom: 6px; left: 6px; }
.hero-visual-corner.bottom-right { bottom: 6px; right: 6px; }

@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 48px; }
  .hero-copy h1 { max-width: 100%; }
  .hero-meta { gap: 16px; }
  .hero-meta .mono { font-size: 10px; }
}

/* Hero ticker */
.hero-ticker {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 24px;
}
.hero-ticker-item {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 0;
  border-top: 2px solid var(--ink);
  font-size: 13px;
  color: var(--ink);
  font-weight: 500;
}
.hero-ticker-item .num { color: var(--ink-muted); }
@media (max-width: 900px) {
  .hero-ticker { grid-template-columns: repeat(2, 1fr); }
}

/* Product grid (Home) */
.product-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.product-grid-4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 1200px) {
  .product-grid-4 { grid-template-columns: repeat(4, 1fr); }
}
.product-card {
  text-align: left;
  background: var(--bg-card);
  border: 0;
  cursor: pointer;
  padding: 32px;
  display: flex;
  flex-direction: column;
  gap: 24px;
  transition: background 250ms;
  font: inherit;
  color: inherit;
}
.product-card:hover { background: var(--bg-alt); }
.product-card-num { color: var(--ink-muted); }
.product-card-img { aspect-ratio: 4/3; }
.product-card-img image-slot { width: 100%; height: 100%; }
.product-card-body { display: flex; flex-direction: column; gap: 8px; flex: 1; }
/* Description stretches to fill surplus height — keeps subs + CTA pinned to card bottom */
.product-card-body > p { flex: 1; min-height: 0; }
.product-card-foot {
  margin-top: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 24px;
  border-top: 1px solid var(--rule-soft);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
}
.product-card-subs {
  color: var(--accent);
  font-weight: 600;
  margin-top: 4px;
}
.product-card:hover .arrow { color: var(--accent); transform: translateX(4px); transition: transform 200ms; }
@media (max-width: 900px) {
  .product-grid { grid-template-columns: 1fr; }
  .product-card { padding: 28px 24px; }
}

/* Industry strip */
.industry-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: rgba(255,255,255,0.08);
  border-top: 1px solid rgba(255,255,255,0.08);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.industry-strip-6 { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 1200px) {
  .industry-strip-6 { grid-template-columns: repeat(6, 1fr); }
}
.industry-strip-item {
  background: var(--ink);
  border: 0;
  text-align: left;
  cursor: pointer;
  padding: 40px 24px;
  color: var(--bg);
  display: flex;
  flex-direction: column;
  transition: background 250ms;
  font: inherit;
}
.industry-strip-item:hover { background: #1a1d22; }
.industry-strip-item .num { margin-bottom: 32px; }
@media (max-width: 1100px) { .industry-strip { grid-template-columns: repeat(2, 1fr); } }

/* Why grid */
.why-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.why-item { 
  background: var(--bg-card); 
  padding: 40px 32px;
  min-height: 240px;
  display: flex;
  flex-direction: column;
}
.why-item .num { color: var(--accent); display: block; margin-bottom: 24px; font-weight: 600; }
.why-item h3 { margin-bottom: 12px; font-size: 18px; }
.why-item p { font-size: 14px; line-height: 1.6; }
@media (max-width: 900px) { .why-grid { grid-template-columns: 1fr; } }
@media (min-width: 901px) and (max-width: 1100px) { .why-grid { grid-template-columns: 1fr 1fr; } }

/* R&D teaser */
.rnd-teaser {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 80px;
  align-items: center;
}
.rnd-teaser-copy h2 { max-width: 14ch; }
@media (max-width: 900px) { .rnd-teaser { grid-template-columns: 1fr; gap: 40px; } }

/* Hero quickfacts */
.hero-quickfacts {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  margin-top: 48px;
  padding-top: 32px;
  border-top: 1px solid var(--rule);
}
.hero-quickfacts .mono {
  color: var(--ink-muted);
  margin-bottom: 8px;
}
.hero-quickfacts .val {
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
  line-height: 1.4;
}
@media (max-width: 900px) {
  .hero-quickfacts { grid-template-columns: 1fr; gap: 20px; }
}

/* Supplier qualification CTA */
.qual-cta {
  margin-top: 48px;
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 40px 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 48px;
}
.qual-cta h3 { font-size: 22px; max-width: 26ch; }
@media (max-width: 900px) {
  .qual-cta { flex-direction: column; align-items: flex-start; padding: 32px 28px; }
}

/* Standards grid */
.standards-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 48px;
  margin-bottom: 0;
}
.qa-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 32px;
}
@media (max-width: 900px) {
  .standards-grid { grid-template-columns: 1fr; gap: 32px; }
}

/* Stats */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 48px;
}
@media (max-width: 900px) { .stats-row { grid-template-columns: 1fr 1fr; gap: 32px; } }

.cert-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.cert-item {
  padding: 28px 20px;
  background: var(--bg-card);
  text-align: center;
  transition: background 200ms;
}
.cert-item:hover { background: var(--bg-alt); }
.cert-code { font-family: var(--font-display); font-size: 22px; letter-spacing: -0.01em; margin-bottom: 10px; font-weight: 500; }
.cert-label { font-size: 10px; }
@media (max-width: 900px) { .cert-row { grid-template-columns: repeat(2, 1fr); } }

/* Highlight grid */
.highlight-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}
.highlight-card { overflow: hidden; }
.highlight-card:hover .placeholder-stripe { opacity: 0.8; }
@media (max-width: 900px) { .highlight-grid { grid-template-columns: 1fr; } }

/* Brochure strip */
.brochure-strip {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 48px;
  padding: 48px;
  border: 1px solid var(--rule);
  background: var(--bg-card);
  box-shadow: var(--shadow-card);
}
.brochure-strip h3 { font-size: 20px; }
@media (max-width: 900px) { .brochure-strip { flex-direction: column; align-items: flex-start; } }

/* === ABOUT === */
.about-hero {
  padding: 64px 0 48px;
}
.about-hero h1 { max-width: 18ch; }
.about-grid {
  display: grid; grid-template-columns: 1fr 1.4fr; gap: 64px; align-items: start;
}
.about-stats {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 56px;
}
@media (max-width: 900px) {
  .about-stats { grid-template-columns: 1fr; gap: 32px; }
  .stats-row { grid-template-columns: 1fr; gap: 32px; }
}
.about-cap-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.about-cap-item {
  background: var(--bg-card);
  padding: 40px 32px;
  min-height: 220px;
  display: flex;
  flex-direction: column;
}
.about-cap-item .num { color: var(--accent); margin-bottom: 24px; display: block; font-weight: 600; }
.about-cap-item h3 { margin-bottom: 12px; flex-shrink: 0; }
.about-cap-item p { font-size: 14px; line-height: 1.6; }
@media (max-width: 900px) { .about-cap-grid { grid-template-columns: 1fr; } }

/* === PRODUCTS === */
.products-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 64px;
  align-items: start;
}
.products-anchor {
  position: sticky;
  top: 96px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-left: 1px solid var(--rule);
  padding-left: 0;
}
.products-anchor a {
  padding: 14px 16px;
  text-decoration: none;
  color: var(--ink-muted);
  font-size: 13px;
  font-family: var(--font-body);
  display: flex;
  gap: 12px;
  cursor: pointer;
  border-left: 2px solid transparent;
  margin-left: -1px;
  transition: all 200ms;
}
.products-anchor a:hover { color: var(--ink); }
.products-anchor a.is-active {
  color: var(--ink);
  border-left-color: var(--accent);
  background: var(--bg-alt);
}
.products-anchor a .num { color: var(--ink-muted); font-family: var(--font-mono); font-size: 11px; }
.products-anchor a.is-active .num { color: var(--accent); }

.product-section {
  padding-bottom: 96px;
  margin-bottom: 96px;
  border-bottom: 1px solid var(--rule);
  scroll-margin-top: 100px;
}
.product-section:last-child { border-bottom: 0; margin-bottom: 0; }
.product-section-head {
  display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: end;
  margin-bottom: 48px;
}
.product-section-num {
  font-family: var(--font-display);
  font-size: 80px;
  font-weight: 350;
  letter-spacing: -0.04em;
  color: var(--accent);
  line-height: 0.9;
}
.product-detail-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 48px;
}
.product-detail-img { aspect-ratio: 4/3; }
.product-detail-img image-slot { width: 100%; height: 100%; }
.product-detail-list {
  display: flex; flex-direction: column; gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.product-detail-list-item {
  background: var(--bg-card);
  padding: 16px 20px;
  display: flex; gap: 16px;
  font-size: 14px;
}
.product-detail-list-item .check { color: var(--accent); font-family: var(--font-mono); }

.product-spec-row {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
  background: var(--rule-soft);
  margin-top: 32px;
  border: 1px solid var(--rule-soft);
}
.product-spec-cell {
  background: var(--bg-card);
  padding: 24px 20px;
}
.product-spec-cell .k { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; font-weight: 600; }
.product-spec-cell .v { font-size: 16px; color: var(--ink); font-weight: 500; }

.product-acc {
  margin-top: 32px;
  border-top: 1px solid var(--rule);
}
.product-acc-row {
  border-bottom: 1px solid var(--rule);
}
.product-acc-row > button {
  width: 100%;
  background: none;
  border: 0;
  padding: 20px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  font: inherit;
  color: var(--ink);
  text-align: left;
}
.product-acc-row > button .label { font-size: 16px; font-weight: 500; }
.product-acc-row .body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 350ms cubic-bezier(.2,.8,.2,1);
}
.product-acc-row.open .body { max-height: 600px; }
.product-acc-row .body-inner { padding: 0 0 24px; font-size: 14px; color: var(--ink-soft); }
.product-acc-row .icon { transition: transform 250ms; font-family: var(--font-mono); color: var(--ink-muted); }
.product-acc-row.open .icon { transform: rotate(45deg); color: var(--accent); }

@media (max-width: 1000px) {
  .products-layout { grid-template-columns: 1fr; }
  .products-anchor { position: static; flex-direction: row; flex-wrap: wrap; border-left: 0; border-top: 1px solid var(--rule); padding-top: 16px; gap: 8px; }
  .products-anchor a { padding: 10px 14px; font-size: 12px; }
  .product-detail-grid { grid-template-columns: 1fr; }
  .product-section-head { grid-template-columns: 1fr; }
  .product-section-num { font-size: 56px; }
  .product-spec-row { grid-template-columns: 1fr; }
}

/* === INDUSTRIES MATRIX === */
.matrix-intro {
  background: var(--bg-alt);
  border: 1px solid var(--rule);
  padding: 24px 32px;
  margin-bottom: 48px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 32px;
}
.matrix-intro-copy h4 { font-size: 16px; margin-bottom: 8px; }
.matrix-intro-copy p { font-size: 14px; color: var(--ink-soft); }
.matrix-legend {
  display: flex;
  gap: 24px;
  align-items: center;
}
.matrix-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-soft);
}
.matrix-legend-item .mark {
  width: 14px; height: 14px;
  border: 1px solid var(--rule);
  border-radius: 50%;
  background: transparent;
}
.matrix-legend-item .mark.filled {
  background: var(--accent);
  border-color: var(--accent);
}

.matrix-wrap {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 48px;
}
.matrix-table {
  border: 1px solid var(--rule);
  background: var(--bg-card);
  display: grid;
  grid-template-columns: 1.6fr repeat(5, 1fr);
  box-shadow: var(--shadow-card);
}
.matrix-table.matrix-4col { grid-template-columns: 1.6fr repeat(4, 1fr); }
.matrix-cell {
  padding: 18px 12px;
  border-right: 1px solid var(--rule-soft);
  border-bottom: 1px solid var(--rule-soft);
  font-size: 12px;
  text-align: center;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: background 200ms, border-color 200ms;
  position: relative;
}
.matrix-cell:nth-child(6n) { border-right: 0; }
.matrix-table.matrix-4col .matrix-cell:nth-child(6n) { border-right: 1px solid var(--rule-soft); }
.matrix-table.matrix-4col .matrix-cell:nth-child(5n) { border-right: 0; }
.matrix-cell.head {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-muted);
  background: var(--bg-alt);
  padding: 20px 10px;
  text-align: center;
  cursor: default;
  font-weight: 600;
}
.matrix-cell.row-head {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  justify-content: flex-start;
  background: var(--bg-alt);
  cursor: pointer;
  padding: 18px 20px;
}
.matrix-cell.row-head:hover { background: #e8e5db; }
.matrix-cell.row-head .num { font-family: var(--font-mono); font-size: 10px; color: var(--accent); margin-right: 10px; font-weight: 600; }
.matrix-cell .mark {
  width: 18px; height: 18px;
  border: 2px solid var(--rule);
  border-radius: 50%;
  background: transparent;
  transition: all 250ms cubic-bezier(.2,.8,.2,1);
}
.matrix-cell.is-on .mark {
  background: var(--accent);
  border-color: var(--accent);
  transform: scale(1.1);
}
.matrix-cell.is-active-row { background: rgba(184,96,44,0.04); }
.matrix-cell.is-active-col { background: rgba(31,58,95,0.04); }
.matrix-cell.is-active-row.is-active-col { background: rgba(184,96,44,0.08); }
.matrix-cell.is-active-row.is-on .mark, .matrix-cell.is-active-col.is-on .mark { 
  background: var(--accent); 
  box-shadow: 0 0 0 4px rgba(184,96,44,0.2);
  border-width: 2px;
  transform: scale(1.15);
}
.matrix-cell:not(.head):not(.row-head):hover {
  background: rgba(184,96,44,0.06);
}

.industry-detail {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 40px 36px;
  position: sticky; top: 96px;
  box-shadow: var(--shadow-card);
}
.industry-detail .num { font-family: var(--font-mono); color: var(--accent); margin-bottom: 16px; font-size: 11px; letter-spacing: 0.1em; font-weight: 600; }
.industry-detail h3 { margin-bottom: 16px; font-size: 22px; }
.industry-detail p { margin-top: 12px; font-size: 14px; line-height: 1.6; }
.industry-detail .apps { display: flex; flex-direction: column; gap: 1px; background: var(--rule-soft); margin-top: 28px; border: 1px solid var(--rule-soft); }
.industry-detail .apps-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px; margin-top: 24px; }
.industry-detail .apps li { background: var(--bg); padding: 14px 16px; font-size: 13px; list-style: none; }

@media (max-width: 1100px) {
  .matrix-wrap { grid-template-columns: 1fr; }
  .matrix-table { font-size: 10px; grid-template-columns: 1.8fr repeat(5, 1fr); }
  .matrix-table.matrix-4col { grid-template-columns: 1.8fr repeat(4, 1fr); }
  .matrix-cell { padding: 12px 6px; }
  .matrix-cell .mark { width: 12px; height: 12px; border-width: 1px; }
  .matrix-cell.head { font-size: 9px; padding: 16px 6px; }
  .matrix-cell.row-head { font-size: 12px; padding: 14px 12px; }
  .industry-detail { position: static; margin-top: 32px; }
  .matrix-intro { flex-direction: column; align-items: flex-start; padding: 20px 24px; }
  .matrix-legend { flex-direction: column; align-items: flex-start; gap: 12px; }
}

/* Industries detailed cards */
.industry-cards {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.industry-card {
  display: grid;
  grid-template-columns: 100px 1.3fr 1.1fr 1fr;
  gap: 40px;
  padding: 48px 40px;
  background: var(--bg-card);
  align-items: start;
}
.industry-card .num { font-family: var(--font-mono); font-size: 11px; color: var(--accent); letter-spacing: 0.1em; font-weight: 600; }
.industry-card h3 { margin-bottom: 12px; font-size: 20px; }
.industry-card .body { font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
.industry-card .apps { display: flex; flex-direction: column; gap: 1px; background: var(--rule-soft); border: 1px solid var(--rule-soft); }
.industry-card .apps-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px; font-weight: 600; }
.industry-card .apps li { list-style: none; font-size: 13px; padding: 12px 16px; background: var(--bg); color: var(--ink-soft); }
.industry-card .cta-col { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
@media (max-width: 1000px) {
  .industry-card { grid-template-columns: 1fr; gap: 24px; padding: 40px 32px; }
}

/* Calculator */
.calculator {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  box-shadow: var(--shadow-card);
}
.calculator-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 0;
}
.calculator-form {
  padding: 48px 40px;
  border-right: 1px solid var(--rule);
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.calculator-header h3 { font-size: 24px; }
.calculator-output {
  padding: 48px 40px;
  background: var(--bg-alt);
}
.calc-output-card {
  background: var(--bg-card);
  border: 1px solid var(--rule);
  padding: 32px;
}
.calc-field {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.calc-field label.mono {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  font-weight: 600;
}
.calc-field select {
  font-family: var(--font-body);
  font-size: 15px;
  background: var(--bg);
  border: 1px solid var(--rule);
  padding: 12px 14px;
  color: var(--ink);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color 200ms;
}
.calc-field select:focus {
  outline: none;
  border-color: var(--accent);
}
.calc-radio-group {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.calc-radio {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 200ms;
  font-size: 14px;
}
.calc-radio:hover {
  border-color: var(--ink);
  background: var(--bg-alt);
}
.calc-radio input[type="radio"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
}
.calc-radio input[type="radio"]:checked + span {
  font-weight: 500;
  color: var(--ink);
}

@media (max-width: 1000px) {
  .calculator-grid { grid-template-columns: 1fr; }
  .calculator-form { border-right: 0; border-bottom: 1px solid var(--rule); padding: 32px 24px; }
  .calculator-output { padding: 32px 24px; }
}
.rnd-hero {
  padding: 80px 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  align-items: end;
}
.rnd-hero h1 { max-width: 14ch; }
@media (max-width: 900px) { .rnd-hero { grid-template-columns: 1fr; } }

.cap-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--rule-soft);
  border: 1px solid var(--rule-soft);
}
.cap-card {
  background: var(--bg-card);
  padding: 40px 32px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: background 250ms;
}
.cap-card:hover { background: var(--ink); color: var(--bg); }
.cap-card .num { color: var(--accent); font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; }
.cap-card h3 { margin-top: 16px; transition: color 250ms; }
.cap-card:hover h3, .cap-card:hover .reveal-body { color: var(--bg); }
.cap-card .reveal-body {
  font-size: 13px;
  color: var(--ink-soft);
  margin-top: 16px;
  max-height: 0;
  opacity: 0;

}
.cap-card:hover .reveal-body { max-height: 200px; opacity: 1; color: rgba(246,244,239,0.8); }
.cap-card .footer-mark {
  margin-top: auto;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 32px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.cap-card:hover .footer-mark { color: rgba(246,244,239,0.6); }
@media (max-width: 900px) { .cap-grid { grid-template-columns: 1fr; } }

/* Process flow */

  grid-template-columns: repeat(5, 1fr);
  gap: 1px;
  background: var(--rule);
  border: 1px solid var(--rule);
}
.process-step {
  background: var(--bg-card);
  padding: 32px 24px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.process-step .num {
  font-family: var(--font-display);
  font-size: 40px;
  font-weight: 350;
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--accent);
}
.process-step h4 { font-size: 16px; }
.process-step p { font-size: 13px; }
@media (max-width: 900px) { .process-flow { grid-template-columns: 1fr 1fr; } }

/* === CONTACT === */
.contact-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 80px;
  align-items: start;
  padding: 64px 0;
}
.contact-form {
  display: flex;
  flex-direction: column;
  gap: 32px;
}
.contact-form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}
.contact-info {
  position: sticky; top: 96px;
}
.contact-info-block {
  border-bottom: 1px solid var(--rule);
  padding: 24px 0;
}
.contact-info-block:first-child { padding-top: 0; }
.contact-info-block .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 8px; }
.contact-info-block .value { font-size: 16px; color: var(--ink); }
.contact-map {
  margin-top: 32px;
  height: 240px;
}
.success-state {

.subcat-card-cta {

}

/* Documentation accordion content */
.doc-row {

}
.doc-item {

}

/* === Innovation & R&D Portfolio === */
.focus-grid {

  background: var(--rule-soft);

}

}

  color: var(--accent);

}

/* === Export page === */
.region-grid {

}

  .region-grid { grid-template-columns: repeat(5, 1fr); }
}
.region-card {

}
.region-code {

}

.export-doc-grid {

}

}
.export-doc-card {

}
.export-doc-card .num {
  color: var(--accent);

}
.export-doc-card h3 { font-size: 18px; margin-bottom: 8px; }
.export-doc-card ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.export-doc-card li {
  font-size: 13px;
  color: var(--ink-soft);
  display: flex;
  gap: 10px;
}
.export-doc-card li .mono {
  color: var(--accent);
  font-weight: 600;
}

/* Process flow with 6 steps */
.process-flow-6 {
  grid-template-columns: repeat(3, 1fr);
}
@media (min-width: 1100px) {
  .process-flow-6 { grid-template-columns: repeat(6, 1fr); }
}
@media (max-width: 700px) {

}

/* Anonymous buyer grid */
.anon-buyer-grid {
  display: grid;

@media (min-width: 1100px) {

}

  flex-direction: column;
  gap: 8px;

}
.anon-buyer-card .num {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 400;
  letter-spacing: -0.02em;

}
.anon-buyer-name {

  font-weight: 500;
  color: var(--ink);

}
.anon-buyer-detail {

  color: var(--ink-soft);

}

/* Client logo strip */

  margin-top: 48px;

}
.logo-strip-head {

  justify-content: space-between;

}

.logo-slot {

}

/* Desktop nav sizing — nav is visible at ≥1101 px.
   Only --_np and font-size are set here; padding and ::after left/right
   derive from --_np automatically — no manual duplication needed. */

  .topbar-nav { gap: 0; }
  .nav-link { --_np: 8px; font-size: 12px; letter-spacing: 0; }
}
@media (min-width: 1280px) {
  .nav-link { --_np: 11px; font-size: 13px; letter-spacing: -0.005em; }
}
@media (min-width: 1440px) {
  .nav-link { --_np: 14px; }
}


/* ============================================================
   Export page v2 — 8 sections
   ============================================================ */

/* Hero */
.export-hero { padding-bottom: calc(var(--section-y) * 0.6); }
.export-hero-grid {

}
@media (min-width: 1100px) {

}

.export-logistics-grid {

}
@media (min-width: 800px)  { .export-logistics-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1100px) { .export-logistics-grid { grid-template-columns: repeat(3, 1fr); } }
.export-logistics-card {

}

}

}

.cat-export-col .colhead {

}

/* ============================================================
   RFQ form additions
   ============================================================ */
.form-section-head {
  margin-bottom: 24px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--rule);
}
.form-section-head h3 {
  font-size: 22px;
  letter-spacing: -0.015em;
  margin-top: 8px;
}
.form-err {
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-top: 4px;
}

  display: flex;
  align-items: stretch;
  min-height: 56px;
  margin-top: 4px;
}

  color: var(--ink);

  border-color: var(--accent);

  color: var(--accent);

}

.rfq-upload-note {
  font-size: 12px;

  line-height: 1.5;
  font-style: italic;

.form-footer {
  border-top: 1px solid var(--rule);
  padding-top: 24px;
  margin-top: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;

  margin: 32px auto 0;
  max-width: 520px;

  background: var(--bg-card);

}

  display: flex;
  justify-content: space-between;

  border: 1px solid var(--rule-soft);

.rfq-step-bar {

.export-sla {
  margin-top: 28px;

/* Main layout */
.prodx-layout {

.prodx-spec-cell {

  padding: 16px 20px;

.prodx-spec-cell .k {

  font-size: 10px;

  margin-bottom: 4px;
}
.prodx-spec-cell .v {
  font-size: 14px;
  color: var(--ink);
  font-weight: 500;
  overflow-wrap: break-word;

/* Sub-category grid */
.prodx-subcat {
